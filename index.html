const HU=[
{id:'B3.1',trk:'B3',wk:TG,title:'S/4HANA security: Fiori launchpad, catalogs and business roles',time:'about 3 hours',
 learn:[
  {h:'What is new',p:'In S/4HANA users reach most functions through the <b>Fiori launchpad</b>, a browser interface, as well as SAP GUI. The launchpad shows <b>tiles</b> (apps). What a user sees is set by <b>catalogs</b> (the apps and their navigation targets) and <b>groups, spaces and pages</b> (how they are laid out). A <b>business role</b> in the role maintenance tool (PFCG) bundles <b>catalogs</b> with the <b>authorisations</b> the apps need. The underlying authorisation concept (roles, objects, users) is the same as in ECC.'},
  {h:'What to review',p:'Look for business roles with <b>too many apps</b>, roles that include <b>administration apps</b>, roles with <b>no users</b> (clean up), and <b>catalogs shared</b> by several roles (a change to one catalog changes many roles). A tile does not equal access: it also needs the authorisations behind it, which you check in the next unit.'}],
 why:'S/4HANA knowledge is a differentiator. Explaining catalogs and business roles clearly shows you have moved beyond ECC-only security.',
 sim:[],files:[BRX],
 lab:{intro:'Open <b>'+BRX+'</b>: 24 Thornfield business roles with the catalog, how many apps it exposes, how many users hold it, and whether it includes administration apps. Treat more than 100 apps as broad.'+VER,tasks:[
  {q:'How many business roles are listed?',t:'num',a:ANS.q1_roles,why:'Population.'},
  {q:'How many roles expose MORE than 100 apps?',t:'num',a:ANS.q1_broad,why:'Broad roles are hard to justify.'},
  {q:'How many users hold those broad roles (add up USERS)?',t:'num',a:ANS.q1_broadusers,why:'Exposure.'},
  {q:'How many roles include administration apps?',t:'num',a:ANS.q1_admin,why:'INCLUDES_ADMIN_APPS = Y.'},
  {q:'How many users hold roles with administration apps (add up USERS)?',t:'num',a:ANS.q1_adminusers,why:'Review each role\'s purpose.'},
  {q:'How many roles have NO users?',t:'num',a:ANS.q1_nouser,why:'Candidates for removal.'},
  {q:'How many catalogs are used by MORE than one role?',t:'num',a:ANS.q1_shared,why:'Changing the catalog changes all those roles.'},
  {q:'Does a tile on the launchpad by itself prove the user can use the app?',t:'mcq',o:['Yes','No, the backend authorisations are also needed','Only for admin apps'],a:1,why:'Catalog shows the app; authorisations allow it to work.'}]},
 tb:[{title:'Explain how Fiori catalogs and business roles control access in S/4HANA.',prompt:'How is access to apps controlled in the Fiori launchpad and what would you review?',model:'Catalogs define which apps are available and the navigation targets, and groups, spaces and pages arrange the tiles. A business role bundles catalogs with the authorisations the apps need, so what the user sees and what they are allowed to do both come from the role. In a review I look for roles with too many apps, roles that include administration apps, roles with no users, and catalogs shared by several roles, since changing one affects many. I remember that the tile only shows the app; the authorisations decide what works.',pts:['Catalogs define apps; groups, spaces and pages lay them out','Business roles bundle catalogs with authorisations','Review roles with too many apps or administration apps','Look at unused roles and shared catalogs','Tile shows the app; authorisations decide access']}],
 quiz:[
  {q:'The Fiori launchpad is...',o:['A browser interface with app tiles','A database','A report'],a:0,e:'Apps as tiles.'},
  {q:'A catalog defines...',o:['Which apps are available','The user\'s password','The company code'],a:0,e:'Apps and navigation targets.'},
  {q:'A role with administration apps needs...',o:['Careful justification and review','No review','Wider access'],a:0,e:'High risk.'},
  {q:'A shared catalog means...',o:['A change affects many roles','Nothing','No users'],a:0,e:'Consider the impact.'}]},

{id:'B3.2',trk:'B3',wk:TG,title:'Fiori app access: tile, service and backend authorisation',time:'about 3 hours',
 learn:[
  {h:'Three layers',p:'For a Fiori app to work for a user, three things line up: the <b>tile is visible</b> (catalog and target mapping), the <b>OData service is authorised</b> (the gateway service the app calls), and the <b>backend authorisations</b> exist (the objects the business function checks). Miss one and the app is <b>broken</b> or hidden.'},
  {h:'The security angle',p:'A <b>visible but broken</b> app causes support noise and sometimes leads people to over-grant access. The reverse matters more for security: if a user has the <b>service and backend authorisation but no tile</b>, they might still reach the data through a <b>direct call to the service</b>. A security review therefore looks at <b>all three layers</b>, not at the launchpad alone.'}],
 why:'Candidates who know that hiding a tile is not security show real S/4HANA understanding.',
 sim:[],files:[FAX],
 lab:{intro:'Open <b>'+FAX+'</b>: 120 apps for one test user. Each row shows whether the tile is visible, whether the OData service is authorised and whether the backend authorisation exists.'+VER,tasks:[
  {q:'How many apps are listed?',t:'num',a:ANS.q2_apps,why:'Population.'},
  {q:'How many apps have a VISIBLE tile?',t:'num',a:ANS.q2_vis,why:'TILE_VISIBLE = Y.'},
  {q:'How many apps work fully (tile visible, service authorised, backend authorised)?',t:'num',a:ANS.q2_works,why:'All three Y.'},
  {q:'How many apps have a visible tile but are BROKEN (service or backend authorisation missing)?',t:'num',a:ANS.q2_broken,why:'The user sees it but it will not work.'},
  {q:'How many visible apps lack the OData service authorisation?',t:'num',a:ANS.q2_nosvc,why:'Service layer gap.'},
  {q:'How many visible apps lack the backend authorisation?',t:'num',a:ANS.q2_noback,why:'Backend layer gap.'},
  {q:'How many apps have NO tile but the service AND backend authorisations are present (hidden access)?',t:'num',a:ANS.q2_hidden,why:'Possible access by direct service call.'},
  {q:'Is hiding the tile enough to prevent use of an app?',t:'mcq',o:['Yes','No, the service and backend authorisations decide','Only in production'],a:1,why:'Authorisations are the control.'}]},
 tb:[{title:'Explain why a tile is not the same as access in Fiori.',prompt:'A manager says "we removed the tile, so nobody can use that app". How do you respond?',model:'Removing the tile only removes the launcher. Whether someone can use the app depends on the OData service authorisation and the backend authorisations in their role. If they still have both, they might reach the function through a direct call to the service. So I review all three layers: the catalog and tile, the service authorisation and the backend authorisation. To restrict access properly, I remove the authorisations from the role, and I test it with a user who has the role.',pts:['A tile is only the launcher','Service authorisation and backend authorisation decide access','Direct service calls may still work without the tile','Review all three layers','Remove the authorisations and test with a real role']}],
 quiz:[
  {q:'An app works when...',o:['Tile, service and backend authorisation all align','Only the tile exists','Only the service exists'],a:0,e:'Three layers.'},
  {q:'Hidden tile with authorisations present is...',o:['A possible access path','Secure','Ideal'],a:0,e:'Check the authorisations.'},
  {q:'A visible but broken app causes...',o:['Support issues and risk of over-granting','Nothing','Faster work'],a:0,e:'Fix the role.'},
  {q:'OData services are...',o:['The interface apps call','Tables','Users'],a:0,e:'Gateway services.'}]},

{id:'B3.3',trk:'B3',wk:TG,title:'SAP BTP access: role collections, MFA and shared users',time:'about 3 hours',
 learn:[
  {h:'Cloud platform basics',p:'<b>SAP Business Technology Platform (BTP)</b> hosts extensions and integrations. Its structure: a <b>global account</b>, <b>subaccounts</b> (for example Dev, Test, Prod), and inside each subaccount <b>role collections</b> that bundle roles and are assigned to users. Users normally sign in through an <b>identity provider</b>. Administrator role collections can change configuration, trust and users, so they are the highest risk.'},
  {h:'What to test',p:'Count <b>administrator assignments</b>, especially in <b>production</b>. Check <b>multi-factor authentication</b> for them, <b>shared accounts</b> (no individual accountability), and <b>inactive users</b> who still hold administrator rights. Ask for the <b>process</b> that grants and reviews these assignments, because cloud access often escapes the normal SAP review.'}],
 why:'More work is moving to BTP. Candidates who bring the same access discipline to the cloud platform are in demand.',
 sim:[],files:[BTX],
 lab:{intro:'Open <b>'+BTX+'</b>: 90 BTP role-collection assignments. Administrator collections are Subaccount Administrator and Security Administrator. <b>PARAMETERS</b>: as-of 30 Sep 2026; inactive means no login for 90 days.'+VER,tasks:[
  {q:'How many assignments are in the file?',t:'num',a:ANS.q3_rows,why:'Population.'},
  {q:'How many are administrator assignments?',t:'num',a:ANS.q3_adm,why:'Subaccount or Security Administrator.'},
  {q:'How many administrator assignments are in the Prod subaccount?',t:'num',a:ANS.q3_admprod,why:'Highest impact.'},
  {q:'How many administrator assignments have NO multi-factor authentication?',t:'num',a:ANS.q3_admnomfa,why:'MFA = N.'},
  {q:'How many assignments are for SHARED users?',t:'num',a:ANS.q3_shared,why:'No individual accountability.'},
  {q:'How many shared users hold an administrator role collection?',t:'num',a:ANS.q3_sharedadm,why:'The worst combination.'},
  {q:'How many assignments are INACTIVE (no login for more than 90 days)?',t:'num',a:ANS.q3_inact,why:'As-of date minus LAST_LOGIN.'},
  {q:'How many inactive assignments are administrators?',t:'num',a:ANS.q3_inactadm,why:'Remove or review.'}]},
 tb:[{title:'Explain how you review access to SAP BTP.',prompt:'How would you review who can administer a BTP environment?',model:'I list the subaccounts and the role collections assigned to each user, focusing on the administrator collections, especially in production. I check that administrators use multi-factor authentication, that there are no shared accounts, and that inactive users no longer hold administrator rights. I ask how assignments are approved and reviewed, since cloud access is often outside the normal SAP review. I report the counts, the risk, and recommend a regular review and removing shared and inactive administrators.',pts:['List subaccounts and role collections, focusing on administrators and production','Check MFA for administrators','Look for shared accounts and inactive users with admin rights','Ask how assignments are approved and reviewed','Report and recommend regular review']}],
 quiz:[
  {q:'A role collection is...',o:['A bundle of roles assigned to users','A table','A report'],a:0,e:'Assigned in a subaccount.'},
  {q:'Highest risk assignment is...',o:['Administrator in production','Viewer in dev','Developer in test'],a:0,e:'Most impact.'},
  {q:'A shared account is a problem because...',o:['No individual accountability','It is cheaper','It is faster'],a:0,e:'Cannot tie actions to a person.'},
  {q:'Admin MFA reduces...',o:['Risk of stolen credentials being used','Licences','File size'],a:0,e:'A second factor.'}]},

{id:'B3.4',trk:'B3',wk:TG,title:'RISE with SAP: shared responsibility and evidence',time:'about 3 hours',
 learn:[
  {h:'Who does what',p:'In <b>RISE with SAP</b> (private cloud) <b>SAP</b> typically runs the <b>infrastructure</b>, the <b>operating system and database</b> and the <b>technical operations</b>. The <b>customer</b> remains responsible for <b>application security</b> (roles, users), <b>business controls</b> and often <b>change management</b> for its own content. Some activities are <b>shared</b>. The exact split is in the contract and service descriptions, so <b>always check the contract</b>.'},
  {h:'Test the split',p:'Build a <b>responsibility matrix</b>. For each activity owned by the <b>customer or shared</b>, check there is a <b>customer control</b>. For each owned by <b>SAP or shared</b>, check you have <b>evidence</b> (a SOC report, the service description or confirmations). An activity owned by SAP for which you have no evidence, or a customer activity with no control, is a <b>gap</b>.'}],
 why:'RISE moves part of the controls to SAP, not all. A tester who maps the split avoids both over-testing and missed controls.',
 sim:[],files:[RSX],
 lab:{intro:'Open <b>'+RSX+'</b>: 36 activities with the owner (SAP, Customer, Shared), whether Thornfield has a control, and whether SAP evidence is available. Blank means not applicable.'+VER,tasks:[
  {q:'How many activities are listed?',t:'num',a:ANS.q4_acts,why:'Population.'},
  {q:'How many are owned by SAP?',t:'num',a:ANS.q4_sap,why:'SAP responsibility.'},
  {q:'How many are owned by the Customer?',t:'num',a:ANS.q4_cust,why:'Thornfield responsibility.'},
  {q:'How many are Shared?',t:'num',a:ANS.q4_shared,why:'Need a clear split.'},
  {q:'How many Customer or Shared activities have NO customer control?',t:'num',a:ANS.q4_nocc,why:'Gaps on our side.'},
  {q:'How many SAP or Shared activities have NO SAP evidence available?',t:'num',a:ANS.q4_sapnoev,why:'Cannot rely on SAP without evidence.'},
  {q:'How many activities have at least one of those two gaps?',t:'num',a:ANS.q4_gaps,why:'Count each activity once.'},
  {q:'Does moving to RISE transfer responsibility for business controls to SAP?',t:'mcq',o:['Yes, completely','No, business and user access controls stay with the customer','Only in production'],a:1,why:'Check the contract, but the customer keeps these.'}]},
 tb:[{title:'Explain the shared responsibility model in RISE with SAP.',prompt:'A client says "we moved to RISE, so SAP now owns our controls". How do you respond?',model:'Moving to RISE transfers parts of the technical operation, such as infrastructure, operating system, database and platform operations, to SAP, but the customer keeps responsibility for application security such as roles and users, for business process controls and often for its own change management. Some activities are shared. I would build a responsibility matrix from the contract and service descriptions, check each customer or shared activity has a customer control, and check we hold evidence such as SOC reports for the SAP and shared activities. Gaps are findings.',pts:['SAP runs infrastructure, OS, database and platform operations','Customer keeps application security, business controls and own changes','Some activities are shared; check the contract','Build a responsibility matrix','Check customer controls and SAP evidence, and report gaps']}],
 quiz:[
  {q:'In RISE, user access remains...',o:['A customer responsibility','SAP\'s responsibility','Nobody\'s'],a:0,e:'Roles and users.'},
  {q:'For SAP-owned activities you need...',o:['Evidence such as a SOC report','Nothing','A new contract'],a:0,e:'You cannot assume.'},
  {q:'The split of responsibility is found in...',o:['The contract and service descriptions','A blog','A guess'],a:0,e:'Always check.'},
  {q:'A shared activity needs...',o:['A clear split of who does what','No action','Deletion'],a:0,e:'Avoid gaps.'}]},

{id:'B3.5',trk:'B3',wk:TG,title:'Security design for an ECC to S/4HANA migration',time:'about 3 hours',
 learn:[
  {h:'Do not copy old roles',p:'A migration is the best chance to <b>clean up access</b>. Copying old roles across carries over years of excess. Use <b>usage data</b>: which transactions were <b>actually used in the last 12 months</b> versus assigned. Retire <b>roles with no users</b> and <b>transactions never used</b>. Check which functions have a <b>Fiori equivalent</b>, which only <b>partially</b>, and which none, because those need design decisions.'},
  {h:'Controls during the project',p:'Plan security design early: <b>role design in the build phase</b>, <b>SoD analysis before go-live</b>, <b>testing of roles</b> with real users, and <b>emergency access</b> for cutover and hypercare. Some old transactions are replaced or removed in S/4HANA, so a <b>simplification check</b> of roles is part of the work.'}],
 why:'Migrations are a big source of consulting work. A tester who can show a data-driven role clean-up stands out.',
 sim:[],files:[RMX2],
 lab:{intro:'Open <b>'+RMX2+'</b>: 40 ECC roles with transactions assigned, transactions used in the last 12 months, whether a Fiori equivalent exists (Y, Partial or N) and the number of users.'+VER,tasks:[
  {q:'How many roles are listed?',t:'num',a:ANS.q5_roles,why:'Population.'},
  {q:'How many roles have NO transactions used in 12 months?',t:'num',a:ANS.q5_nouse,why:'Unused access.'},
  {q:'How many roles have NO users?',t:'num',a:ANS.q5_nousers,why:'Not in use.'},
  {q:'How many roles can be RETIRED (no users OR no used transactions)?',t:'num',a:ANS.q5_retire,why:'Count each role once.'},
  {q:'How many transactions are assigned in total?',t:'num',a:ANS.q5_ta,why:'Sum of TCODES_ASSIGNED.'},
  {q:'How many transactions were used in the last 12 months in total?',t:'num',a:ANS.q5_tu,why:'Sum of TCODES_USED_12M.'},
  {q:'What percentage of assigned transactions was NOT used? (2 decimal places)',t:'num',a:ANS.q5_pct,why:'(assigned minus used) divided by assigned.'},
  {q:'How many roles have NO Fiori equivalent (FIORI_EQUIVALENT = N)?',t:'num',a:ANS.q5_fn,why:'These need a design decision. Partial is a separate group.'}]},
 tb:[{title:'Explain how you would design security for an S/4HANA migration.',prompt:'How would you handle roles when migrating from ECC to S/4HANA?',model:'I would not copy the old roles. I use usage data to see which transactions were actually used in the last 12 months and retire roles with no users and transactions never used. I check which functions have Fiori equivalents, partial equivalents or none, and make design decisions for those. I design roles early, run a segregation of duties analysis before go-live, test roles with real users, and plan emergency access for cutover and hypercare. I also check roles against the S/4HANA simplification changes.',pts:['Do not copy old roles; use usage data','Retire unused roles and transactions','Check Fiori equivalents and decide on gaps','Design early, run SoD before go-live and test with real users','Plan emergency access and check simplification changes']}],
 quiz:[
  {q:'Best basis for cleaning roles is...',o:['Actual usage data','Role names','Age of the role'],a:0,e:'What is used.'},
  {q:'Copying old roles to S/4HANA...',o:['Carries over excess access','Is best practice','Removes risk'],a:0,e:'Clean up instead.'},
  {q:'SoD analysis should be done...',o:['Before go-live','After a year','Never'],a:0,e:'Fix before users get access.'},
  {q:'Emergency access is planned for...',o:['Cutover and hypercare','Never','Only year-end'],a:0,e:'Problems happen then.'}]}
];
HU.forEach(u=>UNITS.push(u));
const TH='Track D. Soft skills';
const AQX='Thornfield_Adv_Auditor_Requests.xlsx',OWX='Thornfield_Adv_Owner_Requests.xlsx',WLX='Thornfield_Adv_Workload.xlsx',EMX='Thornfield_Adv_Email_Review.xlsx',ESX='Thornfield_Adv_Escalation_Log.xlsx';
const NS=' <i>Soft skills are learned by doing. Use the model answers to check yourself, then practise with a real person when you can.</i>';
const KU=[
{id:'D.1',trk:'D',wk:TH,title:'Working with auditors: requests, deadlines and quality',time:'about 3 hours',
 learn:[
  {h:'What auditors need',p:'Auditors work from a <b>request list</b> (often called PBC, "prepared by client"). They need items <b>on the agreed date</b>, <b>complete</b>, <b>accurate</b> and <b>easy to use</b> (the right file, labelled, with the source and date). Late or poor items cost them time and cost you trust. A good liaison <b>tracks every request</b>, knows which are <b>high priority</b>, and warns early when something will be late.'},
  {h:'Habits that work',p:'Agree <b>one point of contact</b> on each side. Hold a short <b>weekly meeting</b> on open items. <b>Check quality before you send</b>: does it answer the request? Is the population complete? Agree what a <b>"good" evidence</b> looks like up front. If you disagree with a request, <b>explain why</b> and offer an alternative, in writing. Never go quiet when late: <b>say so early</b> with a new date.'}],
 why:'Interviewers ask how you handle auditors. Concrete habits, backed by numbers from a tracker, are more convincing than "I communicate well".',
 sim:[],files:[AQX],
 lab:{intro:'Open <b>'+AQX+'</b>: 40 auditor requests with requested date, due date, delivered date, quality outcome and priority. As-of date: <b>14 Oct 2026</b>. A blank DELIVERED means still outstanding.'+NS,tasks:[
  {q:'How many requests are on the list?',t:'num',a:ANS.t1_total,why:'Population.'},
  {q:'How many are still OUTSTANDING (not delivered)?',t:'num',a:ANS.t1_out,why:'Blank DELIVERED.'},
  {q:'How many outstanding requests are OVERDUE (due before the as-of date)?',t:'num',a:ANS.t1_over,why:'Tell the auditor now.'},
  {q:'How many of the overdue ones are High priority?',t:'num',a:ANS.t1_hover,why:'Call about these first.'},
  {q:'How many delivered requests were delivered AFTER the due date?',t:'num',a:ANS.t1_late,why:'DELIVERED later than DUE.'},
  {q:'How many deliveries needed REWORK?',t:'num',a:ANS.t1_rework,why:'Quality problems cost time.'},
  {q:'What percentage of DELIVERED requests were on time (delivered on or before due)? (2 decimal places)',t:'num',a:ANS.t1_ontime,why:'On time divided by delivered.'},
  {q:'You will miss a due date. What is the best action?',t:'mcq',o:['Stay quiet and deliver late','Tell the auditor early with a new date and the reason','Send a poor version on time'],a:1,why:'Early notice keeps trust.'}]},
 tb:[{title:'Explain how you manage requests from the external auditor.',prompt:'The auditor sends a long request list with tight dates. How do you manage it?',model:'I log every request in a tracker with the owner, due date and priority, agree a single point of contact, and hold a short weekly meeting on open items. I check the quality of each item before sending it, including that the population is complete and the source and date are stated. If I cannot meet a date I tell the auditor early with a new date and the reason, and if I disagree with a request I explain why in writing and suggest an alternative. I follow overdue high-priority items first and use the tracker numbers to report progress.',pts:['Log every request with owner, due date and priority','One point of contact and a weekly meeting','Check quality and completeness before sending','Warn early about delays with a new date','Disagree in writing with reasons and an alternative']}],
 quiz:[
  {q:'PBC stands for...',o:['Prepared by client','Pay by cheque','Process before close'],a:0,e:'Items the client prepares.'},
  {q:'When you will be late, you...',o:['Say so early with a new date','Wait','Say nothing'],a:0,e:'Trust matters.'},
  {q:'Before sending evidence you check...',o:['Quality and completeness','The file size','The author name'],a:0,e:'Avoid rework.'},
  {q:'A weekly meeting helps...',o:['Track open items','Avoid all work','Replace evidence'],a:0,e:'Keeps everyone aligned.'}]},

{id:'D.2',trk:'D',wk:TH,title:'Working with control owners: getting evidence',time:'about 3 hours',
 learn:[
  {h:'Respect their time',p:'Control owners have a day job. Ask in a way that is <b>easy to answer</b>: explain <b>why</b> you need it, <b>what exactly</b> (name the report or screenshot), <b>by when</b>, and <b>who to contact</b> for help. Offer a short <b>walkthrough meeting</b> instead of a long email. Say thank you and tell them what happens next.'},
  {h:'Chase and escalate',p:'Agree a rhythm: <b>chase</b> after a few days, <b>escalate</b> to the owner\'s manager after a set number of days or reminders. Escalating is not an attack: it is <b>bringing the right person in</b> with facts: what was asked, when, and how many reminders. Always tell the owner <b>before</b> you escalate.'}],
 why:'Evidence delays are the commonest reason a test runs late. Showing a calm, fair chase and escalation routine is a real strength.',
 sim:[],files:[OWX],
 lab:{intro:'Open <b>'+OWX+'</b>: 36 evidence requests to control owners. As-of date <b>14 Oct 2026</b>. <b>RULES</b>: chase after 3 days with no response; escalate after 7 days, or after 2 or more reminders.'+NS,tasks:[
  {q:'How many evidence requests are listed?',t:'num',a:ANS.t2_items,why:'Population.'},
  {q:'How many are still PENDING (no response)?',t:'num',a:ANS.t2_pend,why:'Blank RESPONDED.'},
  {q:'How many pending requests are older than 3 days and have had NO reminder yet?',t:'num',a:ANS.t2_chase,why:'Send a reminder now.'},
  {q:'How many pending requests should be ESCALATED (older than 7 days or 2 or more reminders) but have not been?',t:'num',a:ANS.t2_esc,why:'ESCALATED = N.'},
  {q:'Which owner has the most pending requests?',t:'txt',a:ANS.t2_top,why:'Count pending by owner.'},
  {q:'What is the average response time in days for requests that were answered? (2 decimal places)',t:'num',a:ANS.t2_avg,why:'RESPONDED minus ASKED.'},
  {q:'How many answered requests took MORE than 7 days?',t:'num',a:ANS.t2_slow,why:'Slow responders.'},
  {q:'Before you escalate to an owner\'s manager you should...',t:'mcq',o:['Tell the owner first and share the facts','Say nothing to the owner','Copy the whole company'],a:0,why:'No surprises.'}]},
 tb:[{title:'Explain how you get evidence from busy control owners.',prompt:'A control owner has not replied for a week. What do you do?',model:'I make requests easy to answer: what I need, why, by when, and who can help, and I offer a short walkthrough. When there is no reply I send a polite reminder after a few days and call if needed. If it is still outstanding after the agreed period I tell the owner I will involve their manager, then escalate with facts: what was asked, when, and the reminders sent. I keep a tracker so I can show the numbers, and I thank people when they respond.',pts:['Make the request specific, with reason and date','Offer a short walkthrough','Remind politely, then call','Tell the owner before escalating, and escalate with facts','Track and say thank you']}],
 quiz:[
  {q:'A good evidence request names...',o:['The exact item, the reason and the date','Only a deadline','Nothing'],a:0,e:'Be specific.'},
  {q:'Escalation should be...',o:['Factual and not a surprise','A threat','Secret'],a:0,e:'Tell the owner first.'},
  {q:'A short walkthrough helps because...',o:['It is easier than a long email','It avoids work','It replaces evidence'],a:0,e:'Conversation clears things up.'},
  {q:'Reminders should be...',o:['Polite and on a rhythm','Daily threats','Never sent'],a:0,e:'Consistent.'}]},

{id:'D.3',trk:'D',wk:TH,title:'Managing your time and workload',time:'about 3 hours',
 learn:[
  {h:'Plan with numbers',p:'List every task with <b>hours</b>, <b>due date</b>, <b>priority</b> and what it <b>depends on</b>. Work out your <b>real capacity</b>: not 8 hours a day but the <b>productive hours</b> after meetings and interruptions. Compare the hours due in each period with capacity. If work is more than capacity you have a <b>shortfall</b>: say so early.'},
  {h:'Handling a shortfall',p:'Do the <b>High-priority and dependent tasks first</b>, because others wait on them. Then <b>negotiate</b>: move a date, drop or reduce a low-value task, or ask for help, <b>giving the numbers</b>. Do not quietly work late hours or hide the problem. Include a <b>buffer</b> for rework and review.'}],
 why:'Missed deadlines are rarely about effort; they are about not seeing the shortfall early. A numeric view of your week shows maturity.',
 sim:[],files:[WLX],
 lab:{intro:'Open <b>'+WLX+'</b>: 16 tasks starting Monday <b>5 Oct 2026</b>. <b>CAPACITY</b> says 6 productive hours per working day, Monday to Friday.'+NS,tasks:[
  {q:'How many tasks are on the list?',t:'num',a:ANS.t3_tasks,why:'Population.'},
  {q:'How many hours are needed in total?',t:'num',a:ANS.t3_hours,why:'Sum of HOURS.'},
  {q:'How many hours do the High priority tasks need in total?',t:'num',a:ANS.t3_highh,why:'Sum of hours for High tasks.'},
  {q:'How many tasks are due by Friday 9 Oct 2026?',t:'num',a:ANS.t3_due1,why:'DUE on or before 9 Oct.'},
  {q:'How many hours of work are due by Friday 9 Oct?',t:'num',a:ANS.t3_dueh,why:'Sum of hours for those tasks.'},
  {q:'What is your capacity for that first week (5 working days at 6 hours)?',t:'num',a:ANS.t3_cap1,why:'5 times 6.'},
  {q:'How many hours is the shortfall for the first week?',t:'num',a:ANS.t3_short,why:'Hours due minus capacity.'},
  {q:'How many tasks depend on another task?',t:'num',a:ANS.t3_dep,why:'Do the tasks they depend on first.'}]},
 tb:[{title:'Explain how you handle more work than you have time for.',prompt:'You have 53 hours of work due this week and 30 hours of capacity. What do you do?',model:'First I check the numbers: what is due, its priority and dependencies, and my real productive capacity. Then I do the high-priority tasks and the ones others depend on first. I tell my manager and the people affected early, showing the shortfall of 23 hours, and propose options: move some dates, reduce the scope of low-value tasks or get help. I do not hide the problem or quietly work extra hours, and I include a buffer for review and rework.',pts:['Check hours due against real productive capacity','Do high-priority and dependency tasks first','Raise the shortfall early with numbers','Offer options: move dates, reduce scope or get help','Do not hide it; include a buffer for rework']}],
 quiz:[
  {q:'Capacity is best measured as...',o:['Productive hours','Hours at work','Days in the month'],a:0,e:'Be realistic.'},
  {q:'A shortfall should be...',o:['Raised early with numbers','Hidden','Ignored'],a:0,e:'Give options.'},
  {q:'Dependent tasks...',o:['Come first, as others wait on them','Come last','Do not matter'],a:0,e:'Unblock others.'},
  {q:'A buffer is for...',o:['Rework and review','Holidays only','Nothing'],a:0,e:'Things take longer.'}]},

{id:'D.4',trk:'D',wk:TH,title:'Writing short, clear emails',time:'about 3 hours',
 learn:[
  {h:'The four checks',p:'A good work email passes four checks: <b>short</b> (about 120 words or fewer), the <b>ask is in the first lines</b>, a <b>deadline date</b> is stated, and <b>one named person</b> is asked to act. A <b>specific subject line</b> helps: "Action by 16 Oct: approve access review list". Use <b>short paragraphs or three bullets</b>. Put background after the ask. Attach, do not paste.'},
  {h:'Examples',p:'Weak: "Hi all, hope you are well. As discussed, we need the thing for the audit when possible." Better: "<b>Ana, please send the September firefighter log by Friday 16 Oct.</b> The auditor needs it for the sample on Monday. Export from the tool as Excel. Thank you." Read it once as the receiver: do they know <b>what, who and when</b>?'}],
 why:'Clear writing saves days. Interviewers ask for an example of how you communicated a request or a problem.',
 sim:[],files:[EMX],
 lab:{intro:'Open <b>'+EMX+'</b>: a review of 30 emails you or your team sent. <b>STANDARD</b> gives the four checks. An email passes only if it meets all four.'+NS,tasks:[
  {q:'How many emails are reviewed?',t:'num',a:ANS.t4_em,why:'Population.'},
  {q:'How many emails are TOO LONG (more than 120 words)?',t:'num',a:ANS.t4_long,why:'WORDS above 120.'},
  {q:'How many do NOT put the ask in the first lines?',t:'num',a:ANS.t4_noask,why:'ASK_IN_FIRST_LINES = N.'},
  {q:'How many have NO deadline stated?',t:'num',a:ANS.t4_nodl,why:'DEADLINE_STATED = N.'},
  {q:'How many do NOT name an owner?',t:'num',a:ANS.t4_noown,why:'OWNER_NAMED = N.'},
  {q:'How many emails PASS all four checks?',t:'num',a:ANS.t4_pass,why:'Short, ask first, deadline and owner.'},
  {q:'How many emails fail TWO or more checks?',t:'num',a:ANS.t4_multi,why:'Count the failures per email.'},
  {q:'What is the average length in words? (2 decimal places)',t:'num',a:ANS.t4_avg,why:'Average of WORDS.'},
  {q:'Which check is failed most often? (length, ask, deadline or owner)',t:'txt',a:ANS.t4_top,why:'Compare the four counts.'}]},
 tb:[{title:'Rewrite a vague request as a clear email.',prompt:'Rewrite this: "Hi all, hope you are well. As discussed, we need the access review evidence for the audit when possible. Thanks." Say what you changed.',model:'Subject: Action by Fri 16 Oct: access review evidence. Ana, please send the signed Q3 access review for the finance team by Friday 16 Oct. The auditor needs it for Monday\'s sample. Export the list from the tool as Excel, and call me if anything is unclear. Thank you. I changed it to name one person, put the ask first, add a date and a reason, say what format, and cut the filler.',pts:['Specific subject with an action and date','Ask in the first line','One named person','A clear deadline date','Short, with the reason and format given']}],
 quiz:[
  {q:'Where should the ask go?',o:['In the first lines','At the end','In an attachment'],a:0,e:'Readers may stop early.'},
  {q:'A deadline should be...',o:['A date','"Soon"','Left out'],a:0,e:'Be specific.'},
  {q:'Ask one person to act when...',o:['You need it done','You want to share the blame','You are unsure'],a:0,e:'Shared tasks get missed.'},
  {q:'A good length is...',o:['About 120 words or fewer','1,000 words','No limit'],a:0,e:'Short.'}]},

{id:'D.5',trk:'D',wk:TH,title:'Disagreements and escalation',time:'about 3 hours',
 learn:[
  {h:'Disagree well',p:'When you disagree with an auditor or an owner, <b>stay calm, listen first</b>, and <b>separate facts from opinions</b>. State <b>your reasoning and the evidence</b>, ask what they would need to change their view, and offer a <b>way forward</b> (more evidence, an expert view, a different approach). Keep it <b>in writing</b>, polite and short. Do not argue in front of others and do not go over someone\'s head without telling them.'},
  {h:'When to escalate',p:'Escalate when an issue <b>blocks the work</b> or is <b>not resolving</b> at your level. Use clear <b>rules</b> such as "more than five working days at team level, go to the manager". Bring <b>facts, options and a recommendation</b>, not just a complaint. Follow up in writing after the conversation. Keep a <b>log</b> of issues and their age.'}],
 why:'Almost every senior interview asks for a time you disagreed with someone. A calm method plus a log shows you can lead.',
 sim:[],files:[ESX],
 lab:{intro:'Open <b>'+ESX+'</b>: 34 issues with type, opened date, current level and status. As-of date <b>14 Oct 2026</b>. Age is in <b>working days</b> (Monday to Friday). <b>RULES</b>: open at Team more than 5 working days, escalate to Manager; open at Manager more than 10 working days, escalate to Sponsor.'+NS,tasks:[
  {q:'How many issues are in the log?',t:'num',a:ANS.t5_issues,why:'Population.'},
  {q:'How many are Open?',t:'num',a:ANS.t5_open,why:'STATUS = Open.'},
  {q:'How many are Closed?',t:'num',a:ANS.t5_closed,why:'STATUS = Closed.'},
  {q:'How many Open issues at Team level are older than 5 working days (should go to the Manager)?',t:'num',a:ANS.t5_esc1,why:'Use NETWORKDAYS or the working day count.'},
  {q:'How many Open issues at Manager level are older than 10 working days (should go to the Sponsor)?',t:'num',a:ANS.t5_esc2,why:'Rule 2.'},
  {q:'Which type (first word, e.g. auditor) has the most OPEN issues?',t:'txt',a:ANS.t5_top,why:'Count open issues by type.'},
  {q:'What is the average age of Open issues in working days? (1 decimal place)',t:'num',a:ANS.t5_avg,why:'Average working-day age.'},
  {q:'What is the age of the oldest Open issue in working days?',t:'num',a:ANS.t5_oldest,why:'The maximum.'}]},
 tb:[{title:'Describe how you handle a disagreement with an auditor.',prompt:'The auditor wants you to treat a control as deficient and you disagree. What do you do?',model:'I listen first and make sure I understand their reasoning and the evidence behind it. Then I separate facts from opinion and explain my view with evidence, asking what they would need to change their conclusion. I offer a way forward such as extra testing, a walkthrough or an expert view, and I keep the exchange polite and in writing. If it is not resolved within the agreed time I escalate to my manager with the facts, the options and my recommendation, after telling the auditor, and I record the issue in the log.',pts:['Listen first and understand their evidence','Separate facts from opinions and explain with evidence','Offer a way forward: extra testing or an expert view','Keep it polite and in writing','Escalate by rule with facts, options and a recommendation']}],
 quiz:[
  {q:'When you disagree you first...',o:['Listen and understand','Argue','Escalate'],a:0,e:'Understand their view.'},
  {q:'An escalation should contain...',o:['Facts, options and a recommendation','A complaint','Nothing'],a:0,e:'Help the decision.'},
  {q:'Escalation rules help because...',o:['They make it fair and predictable','They avoid work','They hide issues'],a:0,e:'Agreed in advance.'},
  {q:'You go over someone\'s head...',o:['Only after telling them','Without warning','Never'],a:0,e:'No surprises.'}]}
];
KU.forEach(u=>UNITS.push(u));
const TRX='Thornfield_Adv_Transport_Log.xlsx',LKX='Thornfield_Adv_Leaver_Lookup.xlsx',PYX='Thornfield_Adv_Payments_Messy.xlsx',JEX='Thornfield_Adv_Journals.xlsx',VCX='Thornfield_Adv_Vendors.csv',ICX='Thornfield_Adv_Invoices.csv';
const CU=[
{id:'C.1',trk:'C',wk:TC,title:'Pivot tables: summarise a full population',time:'about 4 hours',
 learn:[
  {h:'Why pivots',p:'A <b>pivot table</b> turns thousands of rows into a summary in seconds: counts, sums and averages grouped by any column. In testing you use it to <b>understand a population before you sample</b>: who raises most changes, which month is busiest, where approval is missing.'},
  {h:'How to build one',p:'Click anywhere in the data, then <b>Insert, PivotTable</b>. Drag a field to <b>Rows</b> (what you group by), another to <b>Values</b> (what you count or sum). Use <b>Filters</b> for a subset such as one system. To group dates by month, right-click a date in Rows and choose <b>Group</b>. <b>Tip:</b> a pivot is not evidence on its own. Keep the source data and note the filters you used.'}],
 why:'Interviewers ask how you handled a big population. "I pivoted the full transport log to see who imported to production, then tested the exceptions" is a strong answer.',
 sim:[],files:[TRX],
 lab:{intro:'Open <b>'+TRX+'</b>: a log of 240 transports. Build a pivot or use filters. Questions about production mean the <b>PRD</b> system.',tasks:[
  {q:'How many transports are in the log in total?',t:'num',a:ANS.c1_total,why:'Count of TR_ID.'},
  {q:'How many were imported to the PRD system?',t:'num',a:ANS.c1_prd,why:'Pivot: SYSTEM in Rows, count of TR_ID in Values.'},
  {q:'Which requestor has the most PRD imports? (first name)',t:'txt',a:ANS.c1_top,why:'Filter SYSTEM = PRD, then REQUESTOR in Rows.'},
  {q:'How many PRD imports have no ticket number?',t:'num',a:ANS.c1_noticket,why:'Blank TICKET: no change request behind the import.'},
  {q:'How many PRD imports have no approver?',t:'num',a:ANS.c1_noapr,why:'Blank APPROVER.'},
  {q:'How many PRD imports were approved by the same person who requested them?',t:'num',a:ANS.c1_self,why:'Add a helper column =D2=E2 and filter TRUE. Self-approval defeats segregation of duties.'},
  {q:'How many PRD imports are marked EMERGENCY = Y?',t:'num',a:ANS.c1_emerg,why:'Emergency changes need after-the-fact review.'},
  {q:'Which month number (1 to 12) has the most PRD imports?',t:'num',a:ANS.c1_month,why:'Group IMPORT_DATE by month on the PRD subset.'}]},
 tb:[{title:'Explain how you would use a pivot table when testing a large population of changes.',prompt:'You are given a log of every transport imported to production for the year. How do you use a pivot table, and what do you do with the result?',model:'I first confirm the log is complete and note its source and date. Then I build a pivot of production imports by requestor, month and approver to understand the population. I look for patterns that signal risk: imports without a ticket, without approval, approved by the requestor, or marked emergency. I pull those exceptions out as a list and test them individually, and I use the rest to choose a risk-based sample. I keep the source data, the pivot settings and the filters I used as evidence, because the pivot alone is not proof.',pts:['Confirm completeness and source of the log first','Summarise by requestor, month and approver','Spot exceptions: no ticket, no approval, self-approval, emergency','Test the exceptions individually and sample the rest','Keep source data and filters as evidence']}],
 quiz:[
  {q:'A pivot table is best used to...',o:['Summarise a large population quickly','Replace the evidence','Delete duplicates automatically'],a:0,e:'It summarises; you still test and keep evidence.'},
  {q:'Where do you put the field you want to count by?',o:['Values','Filters only','Columns only'],a:0,e:'Counts and sums go in Values.'},
  {q:'A PRD import approved by its own requester shows...',o:['A segregation of duties weakness','Good control','A formatting issue'],a:0,e:'Nobody independent approved it.'},
  {q:'Before pivoting, you should...',o:['Confirm the data is complete and note its source','Hide blank rows','Sort by amount'],a:0,e:'A pivot of incomplete data misleads.'}]},

{id:'C.2',trk:'C',wk:TC,title:'Lookups: match two lists (leavers and users)',time:'about 4 hours',
 learn:[
  {h:'The lookup idea',p:'Many tests compare two lists: <b>SAP users against the HR leaver list</b>, vendors against employees, payments against approved invoices. A lookup finds a value from one list in another. In Excel use <b>XLOOKUP(key, lookup_range, return_range, "not found")</b>, or <b>VLOOKUP</b> and <b>INDEX/MATCH</b> in older versions. <b>COUNTIFS</b> and <b>SUMIFS</b> count or total with several conditions.'},
  {h:'What to watch',p:'Keys must match exactly: spaces, text versus number and case cause false "not found". Decide first what a blank key means. Always test the <b>unmatched</b> rows, not only the matched ones: an SAP user with no HR record is itself a finding.'}],
 why:'The leaver test is asked in almost every access interview. Showing you can do it on full data, not a sample, sets you apart.',
 sim:[],files:[LKX],
 lab:{intro:'Open <b>'+LKX+'</b>. <b>SAP_USERS</b> has each user with the employee ID, status and last logon. <b>HR</b> has employees with a termination date where they have left. Match on EMP_ID. A blank EMP_ID means a user with no employee link (such as a generic user).',tasks:[
  {q:'How many SAP users are in the list?',t:'num',a:ANS.c2_users,why:'Count of USER_ID.'},
  {q:'How many users have a blank EMP_ID?',t:'num',a:ANS.c2_blank,why:'These need a different test: who owns them?'},
  {q:'How many users have an EMP_ID that is NOT found in the HR sheet?',t:'num',a:ANS.c2_orphan,why:'Use XLOOKUP with "not found" and filter. Exclude the blanks.'},
  {q:'How many employees on the HR sheet have a termination date?',t:'num',a:ANS.c2_hrterm,why:'Count non-blank TERM_DATE.'},
  {q:'How many users have STATUS = Active but belong to a terminated employee?',t:'num',a:ANS.c2_termactive,why:'Bring TERM_DATE into SAP_USERS, then filter Active with a date.'},
  {q:'Of those, how many logged on AFTER the termination date?',t:'num',a:ANS.c2_after,why:'LAST_LOGON greater than TERM_DATE is the highest-risk group.'},
  {q:'Which department has the most terminated-but-active users?',t:'txt',a:ANS.c2_dept,why:'Bring DEPT in with a lookup, then count by department.'}]},
 tb:[{title:'Explain how you would test that leavers lose SAP access, using full data.',prompt:'How would you test that terminated employees no longer have active SAP users, and what would you do with the results?',model:'I obtain the HR leaver list and the SAP user list for the same period and confirm both are complete. I match them on employee ID with a lookup. I then list leavers whose users are still active, and separate those who logged on after their termination date, because that suggests possible misuse. I also review users with no HR match and users with no employee ID, since they have no owner. I investigate each exception, find out why access stayed, assess what the user could do, and report the exceptions with counts and root cause.',pts:['Get both lists for the same period and check completeness','Match on employee ID with a lookup','Find leavers still active, and those who logged on after leaving','Review users with no HR match or no owner','Investigate each exception and report counts and cause']}],
 quiz:[
  {q:'Which function finds a value in another list?',o:['XLOOKUP','SUM','CONCAT'],a:0,e:'XLOOKUP, VLOOKUP or INDEX/MATCH.'},
  {q:'A user with no HR record is...',o:['An exception to investigate','Always fine','Ignored'],a:0,e:'Unowned access is a finding.'},
  {q:'Which group is highest risk?',o:['Leavers who logged on after termination','Active employees','Locked users'],a:0,e:'It suggests access was used after leaving.'},
  {q:'Lookups fail wrongly when...',o:['Keys have extra spaces or different formats','The sheet is long','Data is sorted'],a:0,e:'Clean keys first.'}]},

{id:'C.3',trk:'C',wk:TC,title:'Power Query: combine and clean messy data',time:'about 4 hours',
 learn:[
  {h:'Why Power Query',p:'Real extracts arrive in pieces and untidy: one sheet per month, vendor names in mixed case with spaces, amounts stored as text. <b>Power Query</b> (Excel: Data, Get Data) records your cleaning steps so you can <b>repeat them on next month\'s file with one click</b>, and it keeps an audit trail of what you did.'},
  {h:'The usual steps',p:'<b>Append</b> the monthly sheets into one table. <b>Trim</b> and set case to clean text. Change column types: <b>Decimal Number</b> for amounts (replace commas first if needed) and <b>Date</b> for dates. Then <b>Remove duplicates</b> or <b>Group By</b>. Close and load to a new sheet. Check the row count: <b>rows in should equal rows out</b> unless you removed something on purpose.'}],
 why:'Cleaning is where most testing time goes. Candidates who can reproduce a clean population repeatably are far more valuable.',
 sim:[],files:[PYX],
 lab:{intro:'Open <b>'+PYX+'</b>. It has three sheets (JUL, AUG, SEP) of vendor payments. Append them in Power Query, clean the vendor names (trim and one case), and make amounts numeric. Then answer.',tasks:[
  {q:'How many payment rows are there across all three sheets?',t:'num',a:ANS.c3_rows,why:'Append JUL, AUG and SEP.'},
  {q:'How many DIFFERENT vendors are there after cleaning (trim and same case)?',t:'num',a:ANS.c3_vendors,why:'Messy names make more vendors than there really are.'},
  {q:'How many rows have the AMOUNT stored as text? (Before you convert it)',t:'num',a:ANS.c3_txtamt,why:'Text amounts will not add up until converted.'},
  {q:'How many rows have PAY_DATE stored as text?',t:'num',a:ANS.c3_txtdate,why:'Convert to Date, or date filters will miss them.'},
  {q:'What is the total of all amounts after cleaning? (2 decimal places)',t:'num',a:ANS.c3_total,why:'Sum of the numeric AMOUNT column.'},
  {q:'How many rows are duplicate payments (same cleaned vendor, same invoice number and same amount as an earlier row)? Count only the extra copies.',t:'num',a:ANS.c3_dups,why:'Group By or Remove Duplicates on vendor, invoice and amount.'},
  {q:'What is the total value of those extra duplicate rows?',t:'num',a:ANS.c3_dupamt,why:'Money paid twice.'}]},
 tb:[{title:'Explain how you prepare messy extracts for testing and why Power Query helps.',prompt:'You receive three months of payment files with inconsistent text and formats. How do you prepare them for a duplicate payment test, and why use Power Query?',model:'I append the monthly files into one table and record the row count. I clean the key fields: trim spaces, set one case for vendor names, and convert amounts and dates to proper types. I check the count again so nothing was lost. Then I run the duplicate test on vendor, invoice number and amount. I use Power Query because every step is recorded, so I can repeat it on the next file and show the reviewer exactly what I did.',pts:['Append the files and record the row count','Trim and standardise text such as vendor names','Convert amounts and dates to proper types','Reconcile counts before and after','Steps are recorded and repeatable for the next file']}],
 quiz:[
  {q:'Power Query is useful because it...',o:['Records cleaning steps you can repeat','Writes the report for you','Removes the need for source data'],a:0,e:'Repeatable, with an audit trail.'},
  {q:'To combine monthly sheets you...',o:['Append queries','Merge by hand','Copy and paste values'],a:0,e:'Append stacks tables.'},
  {q:'An amount stored as text will...',o:['Not add up until converted','Add up fine','Turn red'],a:0,e:'Change type to Decimal Number.'},
  {q:'After cleaning you check...',o:['Row counts match','Colours','Column widths'],a:0,e:'Rows in should equal rows out.'}]},

{id:'C.4',trk:'C',wk:TC,title:'Full-population tests: find the exceptions',time:'about 4 hours',
 learn:[
  {h:'Why test everything',p:'With data you do not have to sample. A <b>full-population test</b> applies a rule to every record and returns the exceptions. Common rules: <b>self-approval</b> (poster equals approver), <b>weekend postings</b>, amounts <b>just below an approval limit</b>, <b>round amounts</b>, and <b>gaps in a number sequence</b> (a missing journal may have been deleted).'},
  {h:'Design the test',p:'Write each rule down first with its exact boundary (for example "at least 9,500 and below 10,000"). Get the data from the system, check <b>completeness</b> (count and range), run the rule, then <b>investigate the exceptions</b>. An exception is a lead, not a conclusion: there may be a good reason. Document the rule, the data source, the date and the result.'}],
 why:'Auditors increasingly expect analytics over whole populations. Being able to design and explain such tests is a clear advanced skill.',
 sim:[],files:[JEX],
 lab:{intro:'Open <b>'+JEX+'</b>: 693 manual journal lines for September 2026. The <b>PARAMETERS</b> sheet gives the approval limit and the rules. The journal numbers should run from 5000001 to 5000700.',tasks:[
  {q:'How many journal lines are in the file?',t:'num',a:ANS.c4_rows,why:'Count of JE_NO.'},
  {q:'How many journal numbers are missing from the expected sequence 5000001 to 5000700?',t:'num',a:ANS.c4_gaps,why:'700 expected minus lines present. Each gap needs an explanation.'},
  {q:'How many lines were POSTED on a weekend (Saturday or Sunday)?',t:'num',a:ANS.c4_weekend,why:'Use =WEEKDAY(date,2)>5.'},
  {q:'How many lines have an amount from 9,500 up to but not including 10,000 (just below the limit)?',t:'num',a:ANS.c4_near,why:'Possible splitting or avoiding approval.'},
  {q:'How many lines have a round amount (a multiple of 1,000 and at least 5,000)?',t:'num',a:ANS.c4_round,why:'Use =AND(E2>=5000,MOD(E2,1000)=0).'},
  {q:'How many lines were approved by the person who posted them?',t:'num',a:ANS.c4_self,why:'POSTED_BY equals APPROVED_BY.'},
  {q:'What is the total value of those self-approved lines? (2 decimal places)',t:'num',a:ANS.c4_selfamt,why:'Size the exposure.'},
  {q:'Is a line posted at the weekend automatically an error?',t:'mcq',o:['Yes, always','No, it is an exception to investigate','No, weekends are ignored'],a:1,why:'It is a lead. Month-end close can explain weekend work.'}]},
 tb:[{title:'Explain how you would run a full-population test on manual journals.',prompt:'Describe how you would test manual journals for risk using the whole population instead of a sample.',model:'I get the full journal population directly from the system and check completeness: the count and the number range, looking for gaps. I write each rule with exact boundaries: self-approval, weekend postings, amounts just under the approval limit, round amounts and sequence gaps. I run every rule across all records and list the exceptions. I then investigate each exception with the preparer and approver to see whether there is a valid reason, and I document the rules, the data source and date, the results and my conclusion.',pts:['Get the full population and check completeness and gaps','Write each rule with exact boundaries','Run the rules across every record','Investigate each exception, which is a lead not a conclusion','Document the rules, source, date and results']}],
 quiz:[
  {q:'A full-population test applies a rule to...',o:['Every record','A sample of 25','Only large items'],a:0,e:'No sampling needed.'},
  {q:'Amounts just below an approval limit may show...',o:['Splitting to avoid approval','Rounding','Good control'],a:0,e:'Look for it.'},
  {q:'A gap in the journal number sequence suggests...',o:['A journal may have been deleted or not extracted','Nothing','Faster posting'],a:0,e:'Ask for an explanation.'},
  {q:'An exception is...',o:['A lead to investigate','Proof of fraud','Always an error'],a:0,e:'There may be a valid reason.'}]},

{id:'C.5',trk:'C',wk:TC,title:'SQL basics for controls testing',time:'about 4 hours',
 learn:[
  {h:'Why SQL',p:'<b>SQL</b> asks a database questions directly. SAP data often sits in tables, and being able to read and query them is a strong skill. The basic pattern is <code>SELECT columns FROM table WHERE condition GROUP BY column ORDER BY column;</code>. Use <code>COUNT(*)</code> to count rows and <code>SUM(AMOUNT)</code> to total.'},
  {h:'Joins and how to practise',p:'A <b>JOIN</b> links two tables on a key, for example <code>SELECT v.NAME, i.AMOUNT FROM invoices i JOIN vendors v ON i.VENDOR_ID = v.VENDOR_ID;</code>. To practise with no SAP, use a free tool such as <b>DB Browser for SQLite</b>: File, Import, Table from CSV, load the two files below as tables named <b>vendors</b> and <b>invoices</b>. <b>Tip:</b> a blank PO in a CSV may load as an empty text value: use <code>PO_NO = \'\'</code> (and also <code>IS NULL</code> to be safe).'}],
 why:'Entry-level candidates who can say "I queried the full table" stand out. Interviewers often ask for a simple query on the spot.',
 sim:[],files:[VCX,ICX],
 lab:{intro:'Load <b>'+VCX+'</b> as <b>vendors</b> and <b>'+ICX+'</b> as <b>invoices</b> in a SQL tool (or use Excel if you prefer; the answers are the same).',tasks:[
  {q:'How many invoices are in the table? (SELECT COUNT(*))',t:'num',a:ANS.c5_inv,why:'SELECT COUNT(*) FROM invoices;'},
  {q:'What is the total invoice AMOUNT? (2 decimal places)',t:'num',a:ANS.c5_total,why:'SELECT SUM(AMOUNT) FROM invoices;'},
  {q:'How many invoices have NO purchase order (PO_NO empty)?',t:'num',a:ANS.c5_nopo,why:'WHERE PO_NO = \'\' OR PO_NO IS NULL.'},
  {q:'How many invoices were entered and approved by the same person?',t:'num',a:ANS.c5_self,why:'WHERE ENTERED_BY = APPROVED_BY.'},
  {q:'How many invoices are for more than 11,000?',t:'num',a:ANS.c5_big,why:'WHERE AMOUNT > 11000.'},
  {q:'Which vendor ID has the highest total invoice amount? (e.g. v001)',t:'txt',a:ANS.c5_topv,why:'GROUP BY VENDOR_ID ORDER BY SUM(AMOUNT) DESC LIMIT 1.'},
  {q:'What is that vendor\'s total? (2 decimal places)',t:'num',a:ANS.c5_topvamt,why:'The SUM for that group.'},
  {q:'Which vendor ID has the MOST invoices (by count)? (e.g. v001)',t:'txt',a:ANS.c5_vcnt,why:'ORDER BY COUNT(*) DESC. It may differ from the highest total.'}]},

async function token(){
  if(!SES)throw new Error('Not signed in');
  if(Date.now()>SES.exp){const j=await authReq('token?grant_type=refresh_token',{refresh_token:SES.refresh_token});setSes(mkSes(j))}
  return SES.access_token;
}
async function rest(path,opt){
  const t=await token();
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  if(!r.ok)throw new Error('Request failed ('+r.status+')');
  const x=await r.text();return x?JSON.parse(x):null;
}
function mergeState(a,b){
  const r={};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(id=>{
    const x=a[id],y=b[id];
    if(!x)r[id]=y;else if(!y)r[id]=x;
    else r[id]={sim:(x.sim||y.sim)?1:0,lab:Object.assign({},y.lab,x.lab),tb:Object.assign({},y.tb,x.tb),quiz:Math.max(x.quiz,y.quiz)};
  });
  return r;
}
function queuePush(){if(!SES||!ME)return;clearTimeout(PT);PT=setTimeout(push,1500)}
async function push(){
  if(!SES||!ME)return;const s=$('#sync');
  try{
    await rest('advsim_progress?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SES.user.id,email:SES.user.email,state:P,units_done:UNITS.filter(done).length,updated_at:new Date().toISOString()})});
    if(s)s.textContent='Saved';
  }catch(e){if(s)s.textContent='Not saved (will retry)'}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&PT){clearTimeout(PT);push()}});
function hdr(on){['outBtn','syncW'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display=on?'':'none'});const d=document.getElementById('dashBtn');if(d)d.style.display=on&&STAFF?'':'none';const h=document.getElementById('homeBtn');if(h)h.style.display=on?'':'none';const k=document.getElementById('docBtn');if(k)k.style.display=on?'':'none'}
function loginScreen(msg){
  hdr(false);$('#crumb').textContent='Sign in';
  const st='width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0 10px;box-sizing:border-box';
  app.innerHTML=`<h1>Sign in</h1><div class="card"><p>Use your TIB account: the same email and password as in the other TIB apps.</p><label>Email</label><input id="lgE" type="email" autocomplete="username" style="${st}"><label>Password</label><input id="lgP" type="password" autocomplete="current-password" style="${st}"><div class="row"><button class="btn" id="lgB">Sign in</button><button class="btn sec" id="lgF">Forgot password</button></div><p id="lgM" class="small" style="color:#b3261e;margin-top:8px">${esc(msg||'')}</p></div>`;
  const go_=async()=>{
    const e=$('#lgE').value.trim().toLowerCase(),p=$('#lgP').value;
    if(!e||!p){$('#lgM').textContent='Enter your email and password.';return}
    $('#lgB').disabled=true;$('#lgM').textContent='Signing in...';
    try{const j=await authReq('token?grant_type=password',{email:e,password:p});setSes(mkSes(j));await afterLogin()}
    catch(x){$('#lgB').disabled=false;$('#lgM').textContent=(/invalid/i.test(x.message)?'Email or password not correct.':x.message)}
  };
  $('#lgF').onclick=async()=>{const e=$('#lgE').value.trim().toLowerCase();if(!e){$('#lgM').style.color='#b3261e';$('#lgM').textContent='Type your email above first.';return}$('#lgM').style.color='#444';$('#lgM').textContent='Sending...';try{await authReq('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:e});$('#lgM').textContent='If that email has a TIB account, a reset link is on its way. Open it on this device, then set a new password. Note: this is your TIB password for all TIB apps.'}catch(x){$('#lgM').style.color='#b3261e';$('#lgM').textContent=x.message}};$('#lgB').onclick=go_;$('#lgP').onkeydown=ev=>{if(ev.key==='Enter')go_()};
}
function notEnrolled(){
  hdr(false);const o=document.getElementById('outBtn');if(o)o.style.display='';
  $('#crumb').textContent='Not enrolled';
  app.innerHTML=`<h1>Not enrolled</h1><div class="card"><p>You are signed in as <b>${esc(SES.user.email)}</b>, but this account is not enrolled in the Advanced SAP Controls Skills course. Ask your TIB administrator to enrol this email address.</p><div class="row"><button class="btn" onclick="signOut()">Sign out</button></div></div>`;
}
async function afterLogin(){
  try{
    const en=await rest('sapsim_enrollments?select=role&email=eq.'+encodeURIComponent(SES.user.email));
    if(!en||!en.length){notEnrolled();return}
    ME=en[0];STAFF=(ME.role==='admin'||ME.role==='instructor');
    PKEY='tibadv:v1:'+SES.user.id;
    let L={};try{L=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){}
    P=L;
    const rm=await rest('advsim_progress?select=state&user_id=eq.'+SES.user.id);
    if(rm&&rm[0]&&rm[0].state)P=mergeState(L,rm[0].state);
    try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}
    hdr(true);push();home();
  }catch(e){setSes(null);loginScreen('Could not load your account: '+e.message)}
}
function signOut(){clearTimeout(PT);if(SES&&ME&&PT===null){}setSes(null);ME=null;STAFF=false;P={};PKEY='tibadv:v1';loginScreen()}
async function dash(){
  if(!STAFF)return;
  $('#crumb').textContent='Instructor view';
  app.innerHTML='<h1>Trainee progress</h1><p class="mut">Loading...</p>';
  try{
    const [en,pr]=await Promise.all([rest('sapsim_enrollments?select=email,full_name,role&order=email'),rest('advsim_progress?select=email,units_done,updated_at,state')]);
    const m={};pr.forEach(p=>m[p.email]=p);
    const cur=st=>{let k='-';UNITS.forEach(u=>{const s=st&&st[u.id];if(s&&(s.sim||Object.keys(s.lab||{}).length||Object.keys(s.tb||{}).length||s.quiz>=0))k=u.id});return k};
    const adm=ME&&ME.role==='admin';const rows=en.map(e=>{const p=m[e.email];return `<tr><td>${esc(e.email)}${adm&&e.role!=='admin'?` <a href="#" onclick="unenrol('${esc(e.email)}');return false" class="small">remove</a>`:''}</td><td>${esc(e.full_name||'')}</td><td>${esc(e.role)}</td><td>${p?p.units_done:0} / ${UNITS.length}</td><td>${p?cur(p.state):'-'}</td><td>${p?new Date(p.updated_at).toLocaleDateString():'Never'}</td></tr>`}).join('');
    app.innerHTML=`<h1>Trainee progress</h1><div class="card" style="overflow-x:auto"><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Units complete</th><th>Furthest unit</th><th>Last active</th></tr>${rows}</table><p class="small mut">Instructors and admins see every unit unlocked. </p></div>${adm?`<div class="card"><h3 style="margin-top:0">Enrol a trainee</h3><p class="small mut">The person needs a TIB account (the shared sign-in). If they have none yet, create it first, then enrol the same email here. Enrolling here also gives access to the other TIB apps that use this list.</p><input id="enE" type="email" placeholder="Email" style="width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0;box-sizing:border-box"><input id="enN" placeholder="Full name" style="width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0;box-sizing:border-box"><select id="enR" style="width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0 8px"><option value="trainee">Trainee</option><option value="instructor">Instructor</option></select><div class="row"><button class="btn" onclick="enrol()">Enrol</button></div><p id="enM" class="small"></p></div>`:''}<div class="row"><button class="btn sec" onclick="go()">Back to units</button></div>`;
  }catch(e){app.innerHTML='<h1>Trainee progress</h1><p>Could not load: '+esc(e.message)+'</p>'}
}
function recoveryScreen(tok){
  hdr(false);$('#crumb').textContent='New password';
  const st='width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0 10px;box-sizing:border-box';
  app.innerHTML=`<h1>Set a new password</h1><div class="card"><p>This changes your password for all TIB apps. Use at least 8 characters.</p><label>New password</label><input id="npA" type="password" autocomplete="new-password" style="${st}"><label>Repeat it</label><input id="npB" type="password" autocomplete="new-password" style="${st}"><div class="row"><button class="btn" id="npG">Save password</button></div><p id="npM" class="small" style="color:#b3261e;margin-top:8px"></p></div>`;
  $('#npG').onclick=async()=>{const a=$('#npA').value,b=$('#npB').value,m=$('#npM');
    if(a.length<8){m.textContent='Use at least 8 characters.';return}if(a!==b){m.textContent='The two passwords do not match.';return}
    $('#npG').disabled=true;m.textContent='Saving...';
    try{const r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.error_description||'Could not save')}
      history.replaceState(null,'',location.pathname);loginScreen('Password changed. Sign in with the new password.');
    }catch(x){$('#npG').disabled=false;m.textContent=x.message}};
}
async function enrol(){
  const e=$('#enE').value.trim().toLowerCase(),n=$('#enN').value.trim(),r=$('#enR').value,m=$('#enM');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){m.style.color='#b3261e';m.textContent='Enter a valid email.';return}
  try{await rest('sapsim_enrollments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({email:e,full_name:n||null,role:r})});dash()}
  catch(x){m.style.color='#b3261e';m.textContent=/409/.test(x.message)?'Already enrolled.':'Could not enrol ('+x.message+')'}
}
async function unenrol(e){if(!confirm('Remove '+e+' from the course list? This also removes access to other TIB apps that use this list.'))return;try{await rest('sapsim_enrollments?email=eq.'+encodeURIComponent(e),{method:'DELETE'});dash()}catch(x){alert('Could not remove: '+x.message)}}
async function boot(){
  hdr(false);
  const hp=new URLSearchParams((location.hash||'').replace(/^#/,''));
  if(hp.get('type')==='recovery'&&hp.get('access_token')){recoveryScreen(hp.get('access_token'));return}
  let s=null;try{s=JSON.parse(localStorage.getItem('tibadv:auth')||'null')}catch(e){}
  if(!s){loginScreen();return}
  SES=s;
  try{await token();await afterLogin()}catch(e){setSes(null);loginScreen()}
}
boot();

</script></body></html>
