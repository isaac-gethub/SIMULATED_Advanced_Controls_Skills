<html lang="en"><head><meta charset="utf-8">

<title>TIB Advanced SAP Controls Skills: Choose Your Path</title>
<style>
:root{--navy:#1F3A5F;--blue:#2F6DB5;--ink:#1d2733;--mut:#5b6775;--line:#d5dce5;--bg:#f4f6f9;--ok:#1e8a4c;--bad:#b3261e;--warn:#9a6a00;--sap:#dfe6ee}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.top{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header.top b{font-size:15px}header.top small{opacity:.8}
header.top button{margin-left:auto;background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:22px;color:var(--navy);margin:6px 0}h2{font-size:18px;color:var(--navy);margin:14px 0 6px}h3{font-size:15px;color:var(--navy);margin:12px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mut)}.small{font-size:13px}
.wk{margin:16px 0 4px;font-weight:700;color:var(--navy);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.ucard{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.ucard:hover{border-color:var(--blue)}.ucard.lock{opacity:.55;cursor:not-allowed}
.ucard .n{min-width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ucard.done .n{background:var(--ok)}
.ucard .t{flex:1}.ucard .t b{display:block}
.chip{font-size:11px;border-radius:10px;padding:2px 8px;background:#e8edf3;color:var(--mut);white-space:nowrap}
.chip.ok{background:#dff3e7;color:var(--ok)}
.steps{display:flex;gap:4px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.steps button{flex:1;min-width:84px;padding:8px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer}
.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps button.dn::after{content:" ✓";color:var(--ok);font-weight:700}.steps button.on.dn::after{color:#9be3b8}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{border-left:4px solid var(--blue);background:#eef4fb;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.callout.why{border-color:var(--warn);background:#fdf6e3}
.doc{max-width:820px;line-height:1.5}.doc p,.doc li{font-size:15px}.doc table.t{display:block;overflow-x:auto}@media print{header.top,.doc button{display:none}}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}table.t td,table.t th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}table.t th{background:#eef2f7}
.task{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fff}
.task.ok{border-color:var(--ok);background:#f2faf5}
.task input[type=text],.task input[type=number]{padding:7px 9px;border:1px solid #aab4c1;border-radius:6px;font-size:14px;width:min(280px,100%)}
.fb{margin-top:6px;font-size:13px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:#eef4fb}.opt.right{border-color:var(--ok);background:#e9f7ef}.opt.wrong{border-color:var(--bad);background:#fdecea}
textarea{width:100%;min-height:110px;padding:8px;border:1px solid #aab4c1;border-radius:8px;font:inherit}
.kp label{display:block;padding:3px 0}
/* SAP simulator */
.simwrap{display:grid;gap:10px}
.coach{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.coach .st{font-size:12px;color:var(--mut)}.coach .say{font-weight:600;margin:4px 0}.coach .msg{font-size:13px;min-height:18px;color:var(--bad)}
.sap{border:1px solid #8a97a8;border-radius:6px;background:var(--sap);font:13px/1.35 Tahoma,Segoe UI,Arial,sans-serif;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.sap .menu{background:#c9d3df;padding:3px 8px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #9aa7b8}
.sap .menu span[data-id]{cursor:pointer}
.sap .tb{background:#e9eef4;padding:4px 6px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #9aa7b8}
.sap .tb input{flex:1;min-width:0;padding:3px 5px;border:1px solid #7d8b9c;background:#fff;font:inherit}
.sap .tb button{border:1px solid #7d8b9c;background:#f7f9fb;padding:2px 8px;cursor:pointer;font:inherit}
.sap .stitle{background:#f5f8fb;padding:6px 10px;font-weight:700;color:#0b3a6e;border-bottom:1px solid #b7c2d0}
.sap .body{padding:10px;background:#f5f8fb;flex:1;overflow:auto}
.sap .sbar{background:#c9d3df;padding:3px 8px;font-size:12px;border-top:1px solid #9aa7b8;color:#33404f}
.sap .f{display:grid;grid-template-columns:130px 1fr;gap:4px 8px;align-items:center;margin:4px 0;max-width:520px}
.sap .f input{padding:3px 5px;border:1px solid #7d8b9c;background:#fff;font:inherit;min-width:0}
.sap .f input[readonly]{background:#eaeff4}
.sap button.sb{border:1px solid #7d8b9c;background:#f7f9fb;padding:3px 10px;margin:4px 4px 4px 0;cursor:pointer;font:inherit}
.sap table{border-collapse:collapse;background:#fff;font-size:12px;width:100%}.sap td,.sap th{border:1px solid #c3ccd8;padding:3px 6px;text-align:left}.sap th{background:#e3e9f0}
.sap tr[data-id]{cursor:pointer}.sap tr[data-id]:hover td{background:#e6f0fb}
.sap .tabs{display:flex;gap:2px;border-bottom:1px solid #7d8b9c;margin:6px 0;flex-wrap:wrap}.sap .tabs span{padding:3px 10px;border:1px solid #9aa7b8;border-bottom:0;background:#e3e9f0;cursor:pointer}.sap .tabs span.on{background:#fff;font-weight:700}
.sap ul.tree{list-style:none;margin:0;padding-left:16px}.sap ul.tree li{padding:2px 0}.sap ul.tree li[data-id]{cursor:pointer;color:#0b3a6e}
.sap .red td{background:#fbe3e1}.sap .note{color:#33404f;font-size:12px;margin-top:6px}
.tgt{outline:3px solid #ff9f1a!important;outline-offset:1px;animation:pl 1.2s infinite}
@keyframes pl{50%{outline-color:#ffd28a}}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(min-width:600px){main{padding:16px}.simwrap{grid-template-columns:1fr}}
@media(min-width:880px){.simwrap{grid-template-columns:270px 1fr;align-items:start}.coach{position:sticky;top:60px}}
@media(max-width:599px){.sap .f{grid-template-columns:1fr}h1{font-size:19px}}

const TRACKS={A4:{d:'Vendor tools in concept: SAP GRC Access Control, Process Control and Cloud IAG. What each does, what evidence to ask for, and what to test, using mock reports. Three units, about 12 hours. Concepts only, not screen-accurate.'},D:{d:'Working with auditors and control owners, managing your time, writing short clear emails, and handling disagreements and escalation. Five units, about 15 hours.'},B2:{d:'Assurance reports in depth: SOC 1, ISAE 3402 and SOC 2, reading Type 2 results, user entity controls and subservice organisations, and the Trust Services Criteria. Four units, about 12 hours.'},B3:{d:'S/4HANA and RISE security: Fiori catalogs and business roles, Fiori authorisation layers, SAP BTP access, RISE shared responsibility and migration role design. Five units, about 15 hours.'},B1:{d:'SOX 404 and PCAOB expectations: who is covered, top-down scoping and materiality, COSO 2013, evaluating deficiencies, and using the work of others. Five units, about 15 hours.'},A3:{d:'Application controls and interfaces in depth: three-way match, duplicate invoices, interface reconciliation, configuration controls, vendor bank changes and report re-performance. Six units, about 24 hours.'},A2:{d:'ITGC testing in depth: population completeness, change sequence, joiners and leavers, batch jobs, backup and recovery, and concluding on results. Six units, about 24 hours.'},A1:{d:'SAP security and GRC in depth: roles, SoD, access reviews, firefighter access, role changes and mitigating controls. Six units, about 24 hours.'},C:{d:'Go beyond filtering. Six units on the Thornfield data: pivots, lookups, Power Query, full-population tests, SQL and Python. About 24 hours.'}};

{id:'A1.1',trk:'A1',wk:TA,title:'Role design and critical authorisations',time:'about 4 hours',
 learn:[
  {h:'How SAP access is built',p:'A user gets <b>roles</b>. A role holds <b>authorisation objects</b> (such as S_TCODE for which transactions can be started), each with <b>fields</b> (such as the transaction code, the activity, the company code) and <b>values</b>. A <b>single role</b> covers one job task. A <b>composite role</b> bundles single roles. Good design gives each role a clear purpose and no more than that job needs: <b>least privilege</b>.'},
  {h:'What to look for',p:'<b>Critical values</b> are the ones that give wide power: a <b>*</b> (any value) in S_TCODE, activity <b>02</b> (change) on S_DEVELOP with object type <b>DEBUG</b> (can change data while debugging), <b>*</b> activity in S_USER_GRP (user administration), and <b>*</b> in company code fields. A role review lists these and asks: why, who has the role, and is there a compensating control?'}],
 why:'Role design is the root of most access findings. Explaining it simply, with the objects named, shows real understanding.',
 sim:[],files:[RAX],
 lab:{intro:'Open <b>'+RAX+'</b>: the authorisation values of 40 Thornfield roles in four columns: ROLE, OBJECT, FIELD, VALUE. Use filters or a pivot.',tasks:[
  {q:'How many different roles are in the extract?',t:'num',a:ANS.a1_roles,why:'Distinct ROLE.'},
  {q:'How many roles contain S_TCODE with value * (any transaction)?',t:'num',a:ANS.a1_star,why:'Filter OBJECT = S_TCODE and VALUE = *.'},
  {q:'How many roles have S_DEVELOP with ACTVT = 02 AND S_DEVELOP with OBJTYP = DEBUG? (Both rows in the same role)',t:'num',a:ANS.a1_debug,why:'This combination lets someone change data in debug. Count roles that have both rows.'},
  {q:'How many roles have S_USER_GRP with ACTVT = * ?',t:'num',a:ANS.a1_ug,why:'Wide user administration.'},
  {q:'How many roles can start transaction SE16 (S_TCODE value SE16)?',t:'num',a:ANS.a1_se16,why:'Direct table display needs a business reason.'},
  {q:'How many roles have F_BKPF_BUK with company code BUKRS = * (all company codes)?',t:'num',a:ANS.a1_bukrs,why:'Access to every company code.'},
  {q:'How many rows in the whole extract have VALUE = * ?',t:'num',a:ANS.a1_allstar,why:'A quick measure of wide values.'}]},
 tb:[{title:'Explain how you would review roles for critical authorisations.',prompt:'You are given an extract of role authorisation values. How do you review it and what do you report?',model:'I confirm the extract is complete and note its source and date. I list the critical authorisation values: * in S_TCODE, change activity on S_DEVELOP with debug, * activity in S_USER_GRP, and * company codes. I count the roles affected and then find which users hold those roles. For each case I ask for the business reason and whether a compensating control exists. I report the roles, the users, the risk in plain words and a recommendation, such as narrowing the values or removing the role.',pts:['Confirm the extract is complete and dated','List critical values such as * in S_TCODE and debug change','Find which users hold the affected roles','Ask for the business reason and compensating control','Report roles, users, risk and a recommendation']}],
 quiz:[
  {q:'A role is made of...',o:['Authorisation objects with fields and values','Only transaction codes','User names'],a:0,e:'Objects, fields, values.'},
  {q:'Which gives the widest transaction access?',o:['S_TCODE with *','S_TCODE with FB01','S_TCODE with SU53'],a:0,e:'* means any transaction.'},
  {q:'Least privilege means...',o:['Only the access the job needs','Everyone gets the same','No access'],a:0,e:'No more than the job requires.'},
  {q:'A composite role is...',o:['A bundle of single roles','A user','A table'],a:0,e:'It groups single roles.'}]},

{id:'A1.2',trk:'A1',wk:TA,title:'Segregation of duties: rulesets and conflicts',time:'about 4 hours',
 learn:[
  {h:'The idea',p:'<b>Segregation of duties (SoD)</b> means no one person can complete a risky process alone, for example <b>create a vendor and approve payment to it</b>. A <b>ruleset</b> defines <b>functions</b> (business tasks) and the <b>rules</b> that say which two functions must not sit together, with a risk rating. A <b>conflict</b> is a user holding both sides of a rule.'},
  {h:'Running the analysis',p:'Map each user to functions (through their roles). For each rule, find users who have <b>both</b> functions. Rate by risk, count users and conflicts, and focus on <b>High</b> first. In SAP GRC Access Control this is the access risk analysis; here you do it with a lookup or pivot on the data. A user can break several rules, so count <b>users</b> and <b>conflicts</b> separately.'}],
 why:'SoD is the most common access topic in interviews. Doing it on data, with counts, is very convincing.',
 sim:[],files:[SDX],
 lab:{intro:'Open <b>'+SDX+'</b>. <b>USER_FUNCTIONS</b> lists the functions each user holds. <b>RULES</b> lists five rules: each is a pair of functions that conflict, with a rating. High rules are R1, R2 and R4.',tasks:[
  {q:'How many users are in the list?',t:'num',a:ANS.a2_users,why:'Distinct USER_ID.'},
  {q:'How many user-function rows are there?',t:'num',a:ANS.a2_rows,why:'Count of rows.'},
  {q:'How many users break at least one rule?',t:'num',a:ANS.a2_any,why:'A user breaks a rule when they hold both functions of it.'},
  {q:'How many users break rule R1 (CREATE_VENDOR with POST_INVOICE)?',t:'num',a:ANS.a2_r1,why:'Count users with both functions.'},
  {q:'How many users break rule R4 (MAINT_USER with ASSIGN_ROLE)?',t:'num',a:ANS.a2_r4,why:'Same method.'},
  {q:'How many users break at least one HIGH rule (R1, R2 or R4)?',t:'num',a:ANS.a2_high,why:'Focus remediation here first.'},
  {q:'How many users break TWO or more rules?',t:'num',a:ANS.a2_multi,why:'Users and conflicts are different counts.'},
  {q:'Which user ID breaks the most rules?',t:'txt',a:ANS.a2_top,why:'Count of rules per user.'}]},
 tb:[{title:'Explain how you would run and prioritise an SoD analysis.',prompt:'How do you carry out a segregation of duties analysis and decide what to act on first?',model:'I define the functions and the rules with their risk ratings, then map each user to functions through their roles. For each rule I find users who hold both functions, count users and conflicts, and rate the result. I deal with high-risk rules and users who break several rules first. For each case I decide whether to remove one function, redesign the roles, or accept the risk with a mitigating control that someone owns and tests. I report the numbers by rule and the actions agreed.',pts:['Define functions, rules and risk ratings','Map users to functions through roles','Find users holding both sides and count users and conflicts','Prioritise high-risk rules and repeat offenders','Remove, redesign, or mitigate with an owned control']}],
 quiz:[
  {q:'An SoD conflict is...',o:['A user holding both sides of a risky pair','A locked user','An error message'],a:0,e:'Both functions with one person.'},
  {q:'A ruleset contains...',o:['Functions and rules with ratings','Only users','Only roles'],a:0,e:'Functions, rules, risk ratings.'},
  {q:'You start remediation with...',o:['High-risk rules','The oldest user','Locked users'],a:0,e:'Risk first.'},
  {q:'Users and conflicts...',o:['Are counted separately','Are the same count','Do not matter'],a:0,e:'One user can have several conflicts.'}]},

{id:'A1.3',trk:'A1',wk:TA,title:'User access review: design and testing',time:'about 4 hours',
 learn:[
  {h:'What a good review looks like',p:'A <b>user access review</b> has a business owner confirm that each user still needs their access. It works only if it is <b>complete</b> (every active user is in scope), <b>done by the right person</b> (the manager, not the user), <b>timely</b>, produces <b>a decision for every user</b>, and the <b>removals are actually done in SAP</b>.'},
  {h:'How to test it',p:'Compare the review population to the user master: <b>missing users</b> and <b>extra users</b>. Check each review has a decision, the reviewer is independent, the date meets the deadline, and every "Remove" was actioned. Test the <b>precision</b> too: did the reviewer look at the actual access, or just click approve?'}],
 why:'Access reviews fail quietly. A tester who checks completeness and follow-through finds the real gaps.',
 sim:[],files:[ARX],
 lab:{intro:'Open <b>'+ARX+'</b>. <b>USERS</b> is the user master. <b>REVIEW</b> is the result of the review. <b>PARAMETERS</b> has the deadline.',tasks:[
  {q:'How many users in the master have STATUS = Active (the review population)?',t:'num',a:ANS.a3_active,why:'Locked users are out of scope.'},
  {q:'How many ACTIVE users do NOT appear in the review at all?',t:'num',a:ANS.a3_notrev,why:'Completeness gap: lookup each active user in REVIEW.'},
  {q:'How many review rows are for users that are NOT in the user master?',t:'num',a:ANS.a3_extra,why:'Extra rows suggest the wrong population was used.'},
  {q:'How many review rows (for users in the master) have NO decision?',t:'num',a:ANS.a3_nodec,why:'A blank decision is not a review.'},
  {q:'How many users have the decision Remove?',t:'num',a:ANS.a3_remove,why:'These must be actioned.'},
  {q:'Of the Remove decisions, how many were NOT removed in SAP (REMOVED_IN_SAP = N)?',t:'num',a:ANS.a3_notact,why:'The review is only effective if removals happen.'},
  {q:'How many reviews were done by the user for themselves (REVIEWER = USER_ID)?',t:'num',a:ANS.a3_self,why:'Not independent.'},
  {q:'How many reviews were done AFTER the deadline?',t:'num',a:ANS.a3_late,why:'Compare REVIEW_DATE with the parameter.'}]},
 tb:[{title:'Explain how you test a user access review.',prompt:'How would you test that the quarterly user access review is effective?',model:'I take the user master for the review date and the review output. I check completeness: every active user is in the review and there are no unexplained extra users. I check that each user has a decision, the reviewer is the right manager and independent of the user, and the review was done by the deadline. I check every removal decision was actioned in SAP, and I look for evidence the reviewer saw the actual access. I report counts for each gap.',pts:['Compare the review population to the user master for completeness','Check every user has a decision','Check the reviewer is independent and right','Check timing against the deadline','Confirm removals were actioned in SAP']}],
 quiz:[
  {q:'A review is incomplete if...',o:['Active users are missing from it','It is long','It uses Excel'],a:0,e:'Completeness first.'},
  {q:'Who should review a user\'s access?',o:['Their manager or owner','The user','Anyone'],a:0,e:'Independent and knowledgeable.'},
  {q:'A Remove decision that is not actioned means...',o:['The review was ineffective','Nothing','Good control'],a:0,e:'The access remains.'},
  {q:'A blank decision is...',o:['No review of that user','An approval','A removal'],a:0,e:'Needs a decision.'}]},

{id:'A1.4',trk:'A1',wk:TA,title:'Privileged and firefighter access',time:'about 4 hours',
 learn:[
  {h:'What firefighter access is',p:'<b>Firefighter (emergency) access</b> lets a named person use a powerful ID for a limited time to fix an urgent problem. It is acceptable only with <b>controls</b>: a <b>reason and ticket</b> before use, <b>time limits</b>, a <b>log</b> of what was done, and <b>independent review</b> of the log soon after.'},
  {h:'How to test the log',p:'Take the full session log. Check each session has a <b>ticket</b>, is <b>not unusually long</b>, is <b>reviewed by someone other than the user</b> and <b>within the agreed time</b>. Look at <b>out-of-hours</b> use and <b>who uses it most</b>. A session with no review is the biggest gap: the point of the control is the review.'}],
 why:'Privileged access is where real damage happens. Interviewers expect a clear, step-by-step test of the log.',
 sim:[],files:[FFX],
 lab:{intro:'Open <b>'+FFX+'</b>: 160 firefighter sessions in September 2026 with start, end, ticket and the reviewer. A review is on time if done within 7 days of the session end.',tasks:[
  {q:'How many sessions are in the log?',t:'num',a:ANS.a4_sessions,why:'Population.'},
  {q:'How many sessions have NO ticket?',t:'num',a:ANS.a4_noticket,why:'No documented reason.'},
  {q:'How many sessions have NO reviewer?',t:'num',a:ANS.a4_unrev,why:'The key control failed for these.'},
  {q:'How many sessions were reviewed by the same person who used the ID?',t:'num',a:ANS.a4_selfrev,why:'Not independent.'},
  {q:'How many sessions lasted MORE than 4 hours?',t:'num',a:ANS.a4_long,why:'END minus START greater than 4 hours.'},
  {q:'How many sessions STARTED out of hours (22:00 to 05:59)?',t:'num',a:ANS.a4_night,why:'Use the hour of START.'},
  {q:'How many sessions were reviewed more than 7 days after the session ended? (Only sessions with a review date)',t:'num',a:ANS.a4_late,why:'REVIEW_DATE minus END date.'},
  {q:'Which user ID has the most sessions?',t:'txt',a:ANS.a4_top,why:'Count by USER_ID.'}]},
 tb:[{title:'Explain how you test firefighter access.',prompt:'How do you test that emergency access is controlled?',model:'I get the full log of sessions for the period and check it is complete. For each session I look for a ticket and reason, the duration, and whether the reviewer is independent and reviewed within the agreed time. I also look at out-of-hours use and users with the most sessions. For gaps, especially sessions with no review, I ask for the evidence and assess what the user could have done. I report counts by type of gap and recommend fixes such as mandatory tickets and automated review reminders.',pts:['Obtain the full session log and check completeness','Check ticket, reason and duration','Check independent and timely review','Look at out-of-hours use and repeat users','Report counts and recommend fixes']}],
 quiz:[
  {q:'The key control over firefighter access is...',o:['Independent review of the log','Hiding the ID','A password only'],a:0,e:'Review shows what was done.'},
  {q:'A session with no ticket shows...',o:['No documented reason','Good control','A short session'],a:0,e:'Reason and ticket come first.'},
  {q:'A reviewer who is the same as the user is...',o:['Not independent','Fine','Preferred'],a:0,e:'Must be a different person.'},
  {q:'Out-of-hours sessions...',o:['Need extra attention','Are always wrong','Are ignored'],a:0,e:'Not always wrong, but look.'}]},

{id:'A1.5',trk:'A1',wk:TA,title:'Role and security change management',time:'about 4 hours',
 learn:[
  {h:'Changes to roles are changes to access',p:'Changing a role changes what many users can do. So role changes need the same discipline as other changes: a <b>ticket</b>, <b>independent approval</b>, <b>testing</b> (including an SoD check), and a <b>record</b> of who made the change and when. <b>Critical roles</b> (wide or sensitive) need a stronger level of approval.'},
  {h:'How to test',p:'Take the log of role changes (from change documents or the security tool). For each change check ticket, approver is not the person who made the change, test evidence exists, and critical roles had the right approval. <b>Count by person</b> to see who makes most changes: a few people with broad change rights is itself a risk.'}],
 why:'Weak role change control lets access creep in unnoticed. It is a standard access-management test.',
 sim:[],files:[RCX2],
 lab:{intro:'Open <b>'+RCX2+'</b>: 130 role changes in 2026. CRITICAL_ROLE = Y marks roles with sensitive access.',tasks:[
  {q:'How many role changes are in the log?',t:'num',a:ANS.a5_total,why:'Population.'},
  {q:'How many have NO ticket?',t:'num',a:ANS.a5_noticket,why:'No request behind the change.'},
  {q:'How many have NO approver?',t:'num',a:ANS.a5_noapr,why:'Unapproved change.'},
  {q:'How many were approved by the person who made the change?',t:'num',a:ANS.a5_self,why:'Not independent.'},
  {q:'How many changes are to CRITICAL roles?',t:'num',a:ANS.a5_crit,why:'Filter CRITICAL_ROLE = Y.'},
  {q:'How many critical-role changes have no approver OR were self-approved?',t:'num',a:ANS.a5_critbad,why:'The worst combination.'},
  {q:'How many changes have NO test evidence (TEST_EVIDENCE = N)?',t:'num',a:ANS.a5_notest,why:'Untested changes can introduce conflicts.'},
  {q:'Which user made the most role changes?',t:'txt',a:ANS.a5_top,why:'Count by CHANGED_BY.'}]},
 tb:[{title:'Explain how you test role change management.',prompt:'How do you test that changes to SAP roles are controlled?',model:'I obtain a complete log of role changes from the system, not from a list prepared by the team. For each change I check there is a ticket, the approver is independent of the person who made the change, test evidence exists including an SoD check, and critical roles had the stronger approval. I count exceptions, look at who makes the most changes, and investigate the critical cases first. I report the counts, the risk, and recommend enforcing approval in the workflow.',pts:['Get a system-generated log of changes','Check ticket, independent approval and test evidence','Give critical roles extra attention','Look at who makes most changes','Report counts and recommend workflow enforcement']}],
 quiz:[
  {q:'Role changes need...',o:['Ticket, approval and testing','Nothing','Only a ticket'],a:0,e:'Same discipline as any change.'},
  {q:'Why get the log from the system?',o:['To ensure completeness','It is faster','It is prettier'],a:0,e:'A team-prepared list may omit changes.'},
  {q:'Critical roles need...',o:['Stronger approval','No approval','Less testing'],a:0,e:'Higher risk, higher control.'},
  {q:'A self-approved change is...',o:['Not independently approved','Fine','Faster'],a:0,e:'Another person must approve.'}]},

{id:'A1.6',trk:'A1',wk:TA,title:'Mitigating controls and risk acceptance',time:'about 4 hours',
 learn:[
  {h:'When you cannot remove the conflict',p:'Sometimes a conflict is needed for the job, for example in a small team. Then the risk is <b>mitigated</b> by a control: a manager reviews reports of the user\'s activity, or a second person approves. A mitigation must have an <b>owner</b>, be <b>performed</b>, have <b>evidence</b>, be <b>tested</b>, and have a <b>valid, unexpired approval</b>.'},
  {h:'Testing the register',p:'Match each conflict to its mitigation by <b>two keys</b>: user and rule. Look for <b>conflicts with no mitigation</b>, mitigations that have <b>expired</b>, have <b>no owner</b>, were <b>never tested</b>, or belong to conflicts that <b>no longer exist</b> (clean-up). Treat High conflicts first. A mitigation on paper that nobody performs is no control.'}],
 why:'Mitigation registers are often out of date. Finding the gaps shows you understand how SoD is managed in practice.',
 sim:[],files:[MTX],
 lab:{intro:'Open <b>'+MTX+'</b>. <b>CONFLICTS</b> lists user and rule conflicts with a rating. <b>MITIGATIONS</b> lists the controls recorded. As-of date: <b>30 Sep 2026</b>. Match on USER_ID and RULE_ID together.',tasks:[
  {q:'How many conflicts are in the CONFLICTS sheet?',t:'num',a:ANS.a6_conf,why:'Population.'},
  {q:'How many conflicts have NO mitigation (no row with the same user and rule)?',t:'num',a:ANS.a6_unmit,why:'Use a helper key USER_ID&RULE_ID with COUNTIF.'},
  {q:'How many of those unmitigated conflicts are rated High?',t:'num',a:ANS.a6_highunmit,why:'Priority list.'},
  {q:'How many mitigation rows are in the register?',t:'num',a:ANS.a6_mit,why:'Count of rows.'},
  {q:'How many mitigations have EXPIRED (expiry before 30 Sep 2026)?',t:'num',a:ANS.a6_expired,why:'An expired approval is no approval.'},
  {q:'How many mitigations have never been tested (LAST_TESTED blank)?',t:'num',a:ANS.a6_nottested,why:'Untested means unproven.'},
  {q:'How many mitigations have no owner?',t:'num',a:ANS.a6_noowner,why:'Nobody is accountable.'},
  {q:'How many mitigations belong to a user and rule that is NOT in the conflicts list?',t:'num',a:ANS.a6_orphan,why:'Clean-up: the conflict no longer exists.'}]},
 tb:[{title:'Explain how you assess mitigating controls for SoD conflicts.',prompt:'A client says conflicts are mitigated by compensating controls. How do you check that?',model:'I match each conflict to its recorded mitigation by user and rule and list conflicts with no mitigation, starting with the high-rated ones. For the mitigations I check the owner, the approval and expiry date, whether the control is actually performed with evidence, and when it was last tested. I look for stale entries for conflicts that no longer exist. I then test a sample of the controls, because a control on paper that nobody performs does not reduce the risk, and report the gaps with counts.',pts:['Match conflicts to mitigations by user and rule','Find unmitigated conflicts, high first','Check owner, approval and expiry','Test that the control is performed with evidence','Report gaps and stale entries']}],
 quiz:[
  {q:'A mitigating control must have...',o:['An owner, evidence and testing','A name only','A date only'],a:0,e:'It must work in practice.'},
  {q:'Match conflicts to mitigations on...',o:['User and rule together','User only','Rule only'],a:0,e:'A user may have several conflicts.'},
  {q:'An expired mitigation is...',o:['No longer a valid approval','Still fine','A new control'],a:0,e:'Renew or remove.'},
  {q:'A mitigation that is never performed...',o:['Does not reduce risk','Is acceptable','Is excellent'],a:0,e:'It must operate.'}]}
];
AU.forEach(u=>UNITS.push(u));
const TB='Track A2. ITGC testing';
const CPX='Thornfield_Adv_Completeness.xlsx',CDX='Thornfield_Adv_Change_Dates.xlsx',JLX='Thornfield_Adv_Joiner_Leaver.xlsx',BJX='Thornfield_Adv_Batch_Jobs.xlsx',BKX='Thornfield_Adv_Backup_Log.xlsx',TRS='Thornfield_Adv_Test_Results.xlsx';
const IU=[
{id:'A2.1',trk:'A2',wk:TB,title:'Population completeness and information produced by the entity (IPE)',time:'about 4 hours',
 learn:[
  {h:'Test the list before you test the control',p:'Every test starts from a <b>population</b>: all the transports, all the new users, all the payments. If the list you were given is incomplete, your sample is wrong and so is your conclusion. Reports prepared by the client are called <b>information produced by the entity (IPE)</b>. You must show it is <b>complete and accurate</b> before you rely on it.'},
  {h:'How to reconcile',p:'Get the data <b>directly from the system</b> if you can, and note the source, date and parameters. Compare it to the client report: <b>record counts</b>, <b>control totals</b>, then <b>record by record</b> using a lookup on the ID. List the <b>missing</b>, <b>extra</b> and <b>different</b> records, and ask the client to explain each. Do not rely on a report you cannot reconcile.'}],
 why:'Auditors reject workpapers built on unproven reports. Showing how you proved completeness is a mark of a careful tester.',
 sim:[],files:[CPX],
 lab:{intro:'Open <b>'+CPX+'</b>. <b>SYSTEM</b> is the extract you took from SAP. <b>CLIENT_REPORT</b> is the list the client gave you. Compare them on ID.',tasks:[
  {q:'How many records are in the SYSTEM extract?',t:'num',a:ANS.b1_sys,why:'Count of IDs.'},
  {q:'How many records are in the CLIENT_REPORT?',t:'num',a:ANS.b1_cl,why:'Count of IDs.'},
  {q:'How many SYSTEM records are MISSING from the client report?',t:'num',a:ANS.b1_miss,why:'Lookup each SYSTEM ID in the report.'},
  {q:'How many client report records are NOT in the SYSTEM extract?',t:'num',a:ANS.b1_extra,why:'Extra records need explaining.'},
  {q:'For IDs in both lists, how many have a DIFFERENT amount?',t:'num',a:ANS.b1_diff,why:'Compare AMOUNT after the lookup.'},
  {q:'What is the total AMOUNT in the SYSTEM extract? (2 decimal places)',t:'num',a:ANS.b1_systot,why:'Control total.'},
  {q:'What is the total AMOUNT in the CLIENT_REPORT? (2 decimal places)',t:'num',a:ANS.b1_cltot,why:'Control total.'},
  {q:'Can you rely on the client report as the population for testing?',t:'mcq',o:['Yes, it is close enough','No, not until the differences are explained','Yes, the totals are similar'],a:1,why:'Missing, extra and different records must be explained first.'}]},
 tb:[{title:'Explain how you prove a client report is complete and accurate.',prompt:'The client gives you a report of all changes for the year. How do you decide whether you can rely on it?',model:'I get an extract directly from the system, noting the source, the date and the parameters used. I compare record counts and control totals with the client report, then match record by record on the ID. I list records missing from the report, extra records, and records where values differ, and ask the client to explain each one. If I cannot reconcile it, I do not rely on the report, and I document what I did and the conclusion.',pts:['Get an extract directly from the system and record source, date and parameters','Compare counts and control totals','Match record by record on the ID','List missing, extra and different records and get explanations','If it cannot be reconciled, do not rely on it, and document']}],
 quiz:[
  {q:'IPE stands for...',o:['Information produced by the entity','Internal process evidence','Item of poor execution'],a:0,e:'Reports prepared by the client.'},
  {q:'Before sampling you check...',o:['The population is complete','The sample is large','The workpaper is long'],a:0,e:'A wrong population gives a wrong conclusion.'},
  {q:'A record in the system but not in the report means...',o:['The report may be incomplete','Nothing','Good control'],a:0,e:'Ask why it is missing.'},
  {q:'Best source for the population is...',o:['Directly from the system','An email','A summary slide'],a:0,e:'Reduces the risk of omissions.'}]},

{id:'A2.2',trk:'A2',wk:TB,title:'Change management: testing the sequence and segregation',time:'about 4 hours',
 learn:[
  {h:'The order matters',p:'A well-controlled change follows a <b>sequence</b>: request, <b>approval</b>, development, <b>testing</b>, then <b>import to production</b>. Test the sequence with dates: approval must be <b>before</b> the import, and testing before the import. Separately, the person who <b>developed</b> the change must not be the one who <b>imports</b> it to production (segregation of duties).'},
  {h:'Emergency changes',p:'Emergency changes can skip steps, but they need <b>after-the-event approval and review</b>. Count them: many emergency changes suggest weak planning. When you test, separate the emergency changes and test them against the emergency procedure. A <b>clean</b> change passes every rule.'}],
 why:'Change management is core ITGC. Interviewers expect you to describe attributes you would test and the exceptions you would look for.',
 sim:[],files:[CDX],
 lab:{intro:'Open <b>'+CDX+'</b>: 120 changes with requested, approved, tested and imported dates. EMERGENCY = Y marks emergency changes.',tasks:[
  {q:'How many changes are in the file?',t:'num',a:ANS.b2_total,why:'Population.'},
  {q:'How many NON-emergency changes were approved AFTER they were imported?',t:'num',a:ANS.b2_aftr,why:'Approved later than IMPORTED.'},
  {q:'How many changes have a test date AFTER the import date?',t:'num',a:ANS.b2_testaft,why:'Tested after it was already live.'},
  {q:'How many changes have NO test date?',t:'num',a:ANS.b2_notest,why:'No evidence of testing.'},
  {q:'How many changes were imported by the same person who developed them?',t:'num',a:ANS.b2_dev,why:'DEVELOPER equals IMPORTED_BY.'},
  {q:'How many changes are emergency changes?',t:'num',a:ANS.b2_emerg,why:'These follow a different procedure.'},
  {q:'How many NON-emergency changes pass every test: approved on or before import, tested on or before import, and imported by someone other than the developer?',t:'num',a:ANS.b2_clean,why:'The clean population.'}]},
 tb:[{title:'Explain how you would test change management using dates.',prompt:'How do you test that production changes were authorised and tested before going live?',model:'I get the full list of production changes from the system with the request, approval, test and import dates. For non-emergency changes I test that approval and testing happened before the import, that test evidence exists, and that the developer is not the person who imported the change. I treat emergency changes separately against the emergency procedure, checking after-the-event approval. I count each type of exception, investigate them, and report whether the control operated effectively.',pts:['Get the full list with dates from the system','Test approval and testing came before the import','Check test evidence exists','Check the developer is not the importer','Handle emergency changes separately and report exceptions']}],
 quiz:[
  {q:'Approval should happen...',o:['Before the import to production','After the import','Whenever'],a:0,e:'Otherwise it is not authorisation.'},
  {q:'Developer and importer should be...',o:['Different people','The same person','Either'],a:0,e:'Segregation of duties.'},
  {q:'Emergency changes need...',o:['After-the-event approval and review','Nothing','No test ever'],a:0,e:'The emergency procedure.'},
  {q:'Many emergency changes suggest...',o:['Weak planning','Good agility','Nothing'],a:0,e:'Worth reporting.'}]},

{id:'A2.3',trk:'A2',wk:TB,title:'Joiners and leavers: timeliness testing',time:'about 4 hours',
 learn:[
  {h:'Joiners',p:'A new user must be <b>requested</b> and <b>approved</b> by the right person <b>before</b> the ID is created, and the approver should not be the requester. Test: approval exists, approval date is on or before the creation date, and the approver is independent.'},
  {h:'Leavers',p:'When someone leaves, their access must be <b>removed promptly</b>. Define the standard (for example <b>within 7 days</b>), then measure the days between the <b>termination date</b> and the <b>lock date</b>. Count leavers never locked, and those locked late. Never-locked is the worst: it is open access for a person who has gone.'}],
 why:'Joiner and leaver testing is the classic ITGC access test. Doing it with dates on full data is more convincing than a sample.',
 sim:[],files:[JLX],
 lab:{intro:'Open <b>'+JLX+'</b>. <b>JOINERS</b> shows the request, approver, approval date and creation date. <b>LEAVERS</b> shows the termination date and lock date (blank means never locked). The standard is that leavers are locked within <b>7 days</b>.',tasks:[
  {q:'How many joiners are in the list?',t:'num',a:ANS.b3_join,why:'Population.'},
  {q:'How many joiners have NO approver?',t:'num',a:ANS.b3_noapr,why:'No authorisation.'},
  {q:'Of joiners with an approver, how many users were CREATED BEFORE the approval date?',t:'num',a:ANS.b3_before,why:'Created without authority.'},
  {q:'How many joiners were approved by the person who requested them?',t:'num',a:ANS.b3_self,why:'Not independent. (Do not count blank approvers.)'},
  {q:'How many leavers are in the list?',t:'num',a:ANS.b3_leave,why:'Population.'},
  {q:'How many leavers were NEVER locked?',t:'num',a:ANS.b3_never,why:'LOCKED_DATE blank.'},
  {q:'How many leavers were locked MORE than 7 days after termination? (Only those with a lock date)',t:'num',a:ANS.b3_late,why:'LOCKED_DATE minus TERM_DATE greater than 7.'},
  {q:'What is the longest delay, in days, between termination and lock?',t:'num',a:ANS.b3_max,why:'The maximum of the differences.'}]},
 tb:[{title:'Explain how you would test joiners and leavers with dates.',prompt:'How would you test that user access is granted properly and removed on time?',model:'For joiners I take the full list of new users and check there is an approval from an independent approver dated before the user was created. For leavers I take the HR list of terminations and the system lock dates, set the standard such as seven days, and measure the delay for each leaver. I report leavers never locked and those locked late, with the longest delay, check whether the users logged on after leaving, and investigate the causes.',pts:['Take full lists for joiners and leavers','Check approval exists, is independent and precedes creation','Set the standard and measure days to lock','Report never-locked and late-locked leavers','Check for logons after leaving and investigate causes']}],
 quiz:[
  {q:'A joiner user created before approval shows...',o:['Access without authority','Good control','A fast process'],a:0,e:'Approval must come first.'},
  {q:'The worst leaver result is...',o:['Never locked','Locked in 1 day','Locked in 7 days'],a:0,e:'Open access forever.'},
  {q:'Timeliness is measured as...',o:['Days from termination to lock','Hours worked','Number of roles'],a:0,e:'Compare to the standard.'},
  {q:'The approver should be...',o:['Independent of the requester','The requester','Anyone'],a:0,e:'Segregation.'}]},

{id:'A2.4',trk:'A2',wk:TB,title:'Batch jobs and operations monitoring',time:'about 4 hours',
 learn:[
  {h:'What to test',p:'Batch jobs run payments, interfaces and closing tasks. The ITGC risks: jobs <b>fail unnoticed</b>, jobs are <b>changed without approval</b>, jobs run under a <b>named person</b> rather than a system user, and failed critical jobs are <b>not followed up</b> with an incident. Test the <b>job run log</b> and the <b>job change log</b>.'},
  {h:'Method',p:'List all runs. Count failures and cancellations. For each failure check there is an <b>incident or ticket</b>. Give <b>critical jobs</b> (payments, interfaces to the ledger, bank files) extra attention. Check job changes have a ticket. Then ask whether failures were corrected and the job re-run, because a failed payment run may be a missed payment.'}],
 why:'Operations controls are often tested late. Showing the exact attributes you would check shows depth.',
 sim:[],files:[BJX],
 lab:{intro:'Open <b>'+BJX+'</b>. <b>JOB_RUNS</b> has the run log for September 2026. <b>JOB_CHANGES</b> has changes to job definitions. CRITICAL = Y marks payment and interface jobs. BATCH_SVC is the system user.',tasks:[
  {q:'How many job runs are in the log?',t:'num',a:ANS.b4_runs,why:'Population.'},
  {q:'How many runs have STATUS = Failed?',t:'num',a:ANS.b4_fail,why:'Count failures.'},
  {q:'How many runs that did NOT finish (Failed or Cancelled) have no incident number?',t:'num',a:ANS.b4_noinc,why:'Failure with no follow-up.'},
  {q:'How many CRITICAL jobs failed?',t:'num',a:ANS.b4_critfail,why:'Priority.'},
  {q:'How many of those critical failures have no incident?',t:'num',a:ANS.b4_critnoinc,why:'The most serious gap.'},
  {q:'How many runs were run under a named person rather than BATCH_SVC?',t:'num',a:ANS.b4_person,why:'Jobs should run under a controlled system user.'},
  {q:'How many job changes are recorded?',t:'num',a:ANS.b4_chg,why:'Rows in JOB_CHANGES.'},
  {q:'How many job changes have NO ticket?',t:'num',a:ANS.b4_chgnotk,why:'Unapproved job change.'}]},
 tb:[{title:'Explain how you would test batch job controls.',prompt:'How do you test that batch jobs are monitored and changes to them are controlled?',model:'I take the full job run log and the job change log for the period. I count failed and cancelled runs and check each has an incident or ticket and was corrected and re-run, giving critical jobs such as payments and interfaces priority. I check which user runs the jobs and that job changes have a ticket and approval. I report the exceptions, assess the business impact of unresolved critical failures, and recommend monitoring and alerting.',pts:['Get the full run log and change log','Count failures and check each has an incident and re-run','Prioritise critical jobs','Check running user and change approvals','Report exceptions and business impact']}],
 quiz:[
  {q:'A failed critical job with no incident shows...',o:['No follow-up on a failure','Good control','A slow job'],a:0,e:'Monitoring failed.'},
  {q:'Jobs should run under...',o:['A controlled system user','Any named person','Nobody'],a:0,e:'Named people can be misused.'},
  {q:'Job changes need...',o:['A ticket and approval','Nothing','A phone call'],a:0,e:'Same as any change.'},
  {q:'After a failed payment job you ask...',o:['Was it re-run and was anyone affected','Nothing','Who is on leave'],a:0,e:'There may be business impact.'}]},

{id:'A2.5',trk:'A2',wk:TB,title:'Backup and recovery testing',time:'about 4 hours',
 learn:[
  {h:'What good looks like',p:'Backups must run <b>on schedule</b>, <b>failures must be rerun</b>, and the business must <b>prove it can restore</b> from a backup. A backup that has never been restored is an unproven backup. Production matters most, but non-production backups matter if they hold copies of real data.'},
  {h:'How to test',p:'From the backup log for the period: count <b>failures</b>, check <b>reruns</b> for each, and look for <b>missing days</b> (no record at all). Compare the <b>last restore test date</b> for each system to the required frequency. A missing day is not the same as a failure: you cannot tell what happened, so ask.'}],
 why:'Recovery is a standard ITGC area, and the "missing days" idea shows you test completeness of a log, not only what is in it.',
 sim:[],files:[BKX],
 lab:{intro:'Open <b>'+BKX+'</b>. <b>BACKUPS</b> has the daily backup log for three systems from 1 Jul to 30 Sep 2026 (92 days). <b>RESTORE_TESTS</b> has the last restore test. A restore test is required every 365 days; as-of date 30 Sep 2026. Expect one record per system per day.',tasks:[
  {q:'How many backup records are in the log?',t:'num',a:ANS.b5_rows,why:'Rows in BACKUPS.'},
  {q:'How many backups FAILED?',t:'num',a:ANS.b5_fail,why:'STATUS = Failed.'},
  {q:'How many failures were on the PRD system?',t:'num',a:ANS.b5_failprd,why:'Production first.'},
  {q:'How many failed backups were NOT rerun (RERUN = N)?',t:'num',a:ANS.b5_norerun,why:'A failed backup not rerun leaves a gap in protection.'},
  {q:'On how many days is there NO record at all for PRD?',t:'num',a:ANS.b5_prdmiss,why:'92 days minus PRD records.'},
  {q:'How many records are missing across all three systems? (92 days times 3 systems minus records)',t:'num',a:ANS.b5_allmiss,why:'Completeness of the log.'},
  {q:'How many systems have a last restore test OLDER than 365 days at 30 Sep 2026?',t:'num',a:ANS.b5_oldrest,why:'Restore tests are overdue.'}]},
 tb:[{title:'Explain how you test backup and recovery controls.',prompt:'How do you test that data can be recovered?',model:'I take the backup log for the period and test completeness: one record per system per day, and any missing days I follow up. I count failures, check each was rerun, and give production priority. I then look at evidence of restore tests: when each system was last restored, whether it met the required frequency and whether the restore worked. A backup never restored is unproven, so overdue restore tests are a finding. I report the counts and the risk to recovery.',pts:['Test the log is complete: one record per system per day','Count failures and check each was rerun','Prioritise production','Check last restore test against the required frequency','Report counts and the risk to recovery']}],
 quiz:[
  {q:'A backup never restored is...',o:['Unproven','Proven','Excellent'],a:0,e:'You must be able to restore.'},
  {q:'A missing day in the log is...',o:['A completeness gap to follow up','A success','Irrelevant'],a:0,e:'You cannot tell what happened.'},
  {q:'A failed backup needs...',o:['A rerun','Nothing','A new system'],a:0,e:'Close the protection gap.'},
  {q:'Which system gets priority?',o:['Production','Development','None'],a:0,e:'Most business impact.'}]},

{id:'A2.6',trk:'A2',wk:TB,title:'Sampling results and concluding on the control',time:'about 4 hours',
 learn:[
  {h:'From results to conclusion',p:'After testing a sample you <b>conclude</b>. Typical rules: <b>no exceptions</b>: effective. <b>One exception</b> in a larger sample: <b>extend the sample</b> to see whether it was an isolated error. <b>Two or more</b>, or any exception when the sample is very small (such as 1 or 2 items): the control is <b>deficient</b>. Rules vary by firm; always use the engagement methodology.'},
  {h:'Then evaluate',p:'A deficient control is not yet a finding. Ask: how <b>often</b> does it happen, what is the <b>magnitude</b> of the possible error, is there a <b>compensating control</b>, and what is the <b>effect on the financial statements</b>? Classify as <b>control deficiency, significant deficiency or material weakness</b> and report with the facts.'}],
 why:'The ability to move from test results to a clear conclusion is what separates a tester from a reviewer.',
 sim:[],files:[TRS],
 lab:{intro:'Open <b>'+TRS+'</b>. <b>RESULTS</b> shows 18 controls, their sample size and exceptions. <b>RULES</b> gives the conclusion rules used here: 0 exceptions is Effective; 1 exception means Extend the sample; 2 or more is Deficient; any exception on a sample of 1 or 2 is Deficient.',tasks:[
  {q:'How many controls were tested?',t:'num',a:ANS.b6_controls,why:'Rows in RESULTS.'},
  {q:'How many items were tested in total (sum of sample sizes)?',t:'num',a:ANS.b6_samples,why:'Add the SAMPLE_SIZE column.'},
  {q:'How many exceptions were found in total?',t:'num',a:ANS.b6_exc,why:'Add the EXCEPTIONS column.'},
  {q:'How many controls are Effective under the rules?',t:'num',a:ANS.b6_eff,why:'Zero exceptions.'},
  {q:'How many controls need the sample EXTENDED?',t:'num',a:ANS.b6_ext,why:'One exception on a sample larger than 2.'},
  {q:'How many controls are Deficient?',t:'num',a:ANS.b6_def,why:'Two or more, or any exception on a sample of 1 or 2.'},
  {q:'Which control ID has the highest exception RATE (exceptions divided by sample size)?',t:'txt',a:ANS.b6_top,why:'Rate, not count.'},
  {q:'What is the overall exception rate as a percentage (total exceptions divided by total sample, 2 decimal places)?',t:'num',a:ANS.b6_rate,why:'Weighted by sample.'}]},
 tb:[{title:'Explain how you conclude on a control after testing.',prompt:'You found one exception in a sample of 25. What do you do?',model:'I do not conclude yet. I understand the exception and decide whether it is a one-off error. Under the methodology one exception in a sample of 25 means I extend the sample, testing more items, and if the extended sample is clean I can conclude the control is effective with that isolated exception noted. If further exceptions appear, the control is deficient. I then evaluate frequency, magnitude, compensating controls and the effect on the financial statements to classify the deficiency, and I report it with the facts.',pts:['Understand the exception first','Extend the sample as the methodology requires','Conclude effective only if the extended sample is clean','More exceptions means deficient','Evaluate frequency, magnitude, compensating controls and impact, then report']}],
 quiz:[
  {q:'One exception in a larger sample usually means...',o:['Extend the sample','Conclude effective immediately','Fail the engagement'],a:0,e:'Check whether it is isolated.'},
  {q:'Any exception in a sample of 1 or 2 is...',o:['Deficient','Effective','Ignored'],a:0,e:'Too small to extend.'},
  {q:'Exception RATE is...',o:['Exceptions divided by sample size','Exceptions only','Sample size only'],a:0,e:'Compare controls fairly.'},
  {q:'A deficient control becomes a finding after...',o:['Evaluating impact and compensating controls','Nothing','A coin toss'],a:0,e:'Classify and report.'}]}
];
IU.forEach(u=>UNITS.push(u));
const TD='Track A3. Application controls and interfaces';
const TWX='Thornfield_Adv_Three_Way_Match.xlsx',DIX='Thornfield_Adv_Duplicate_Invoices.xlsx',IRX='Thornfield_Adv_Interface_Recon.xlsx',TLX='Thornfield_Adv_Tolerance_Config.xlsx',VBX='Thornfield_Adv_Vendor_Bank_Changes.xlsx',AGX='Thornfield_Adv_Aging_Report.xlsx';
const PU=[
{id:'A3.1',trk:'A3',wk:TD,title:'Three-way match and tolerances',time:'about 4 hours',
 learn:[
  {h:'What the control does',p:'A <b>three-way match</b> compares the <b>purchase order</b> (what was ordered and the agreed price), the <b>goods receipt</b> (what arrived) and the <b>supplier invoice</b> (what is being billed). If they agree within <b>tolerances</b>, the invoice can be paid. If not, SAP <b>blocks</b> it for review. It prevents paying for goods not received or at the wrong price.'},
  {h:'How to test it',p:'The tolerance settings are <b>configuration</b>. The test is on the <b>data</b>: find invoices <b>with no goods receipt</b>, <b>quantity above what was received</b>, and <b>price above the PO price by more than the tolerance</b>. Then check whether they were <b>blocked</b> or <b>paid</b>. A paid exception means the control did not work, or was overridden. Quantify the money.'}],
 why:'Application controls are tested once on configuration and then by looking for exceptions in the full data. Interviewers like candidates who can find the paid exceptions.',
 sim:[],files:[TWX],
 lab:{intro:'Open <b>'+TWX+'</b>: 200 invoices with PO, goods receipt and invoice quantities and prices. <b>PARAMETERS</b>: price tolerance 5%, quantity tolerance 0. STATUS is Paid or Blocked.',tasks:[
  {q:'How many invoices are in the file?',t:'num',a:ANS.m1_total,why:'Population.'},
  {q:'How many invoices have NO goods receipt (GR_QTY blank)?',t:'num',a:ANS.m1_nogr,why:'Billed for something not received.'},
  {q:'How many of those were PAID?',t:'num',a:ANS.m1_nogrpaid,why:'The control should have blocked them.'},
  {q:'How many invoices (with a goods receipt) have INV_QTY greater than GR_QTY?',t:'num',a:ANS.m1_qty,why:'Billed for more than received.'},
  {q:'How many invoices have INV_PRICE more than 5% above PO_PRICE?',t:'num',a:ANS.m1_price,why:'Outside the price tolerance.'},
  {q:'How many of those price exceptions were PAID?',t:'num',a:ANS.m1_pricepaid,why:'Paid despite being outside tolerance.'},
  {q:'What is the total overpayment on those paid price exceptions: (INV_PRICE minus PO_PRICE) times INV_QTY, added up? (2 decimal places)',t:'num',a:ANS.m1_over,why:'Quantify the exposure.'},
  {q:'How many invoices are Blocked in total?',t:'num',a:ANS.m1_blocked,why:'Blocked is not the same as an exception: many blocked invoices have no exception.'}]},
 tb:[{title:'Explain how you test a three-way match control.',prompt:'How would you test that SAP only pays invoices that match the order and receipt?',model:'I confirm how the control is configured, including the price and quantity tolerances. Then I test it on the full data: invoices with no goods receipt, quantity above what was received, and price above the PO price by more than the tolerance. For each exception I check whether it was blocked or paid, and who released any blocks. Paid exceptions show the control failed or was overridden, so I quantify the value, discuss the cause with the business, and report.',pts:['Confirm the configuration and tolerances','Test the full data for no receipt, excess quantity and price variance','Check whether each exception was blocked or paid','Check who released blocked invoices','Quantify paid exceptions and report']}],
 quiz:[
  {q:'A three-way match compares...',o:['PO, goods receipt and invoice','Three invoices','Three users'],a:0,e:'Order, receipt and bill.'},
  {q:'A paid invoice outside tolerance means...',o:['The control did not work or was overridden','Good control','A rounding issue'],a:0,e:'Investigate.'},
  {q:'Tolerance is...',o:['An allowed variance','A blocked invoice','A report'],a:0,e:'Within it, SAP allows payment.'},
  {q:'An invoice with no goods receipt should be...',o:['Blocked','Paid','Deleted'],a:0,e:'Nothing was received.'}]},

{id:'A3.2',trk:'A3',wk:TD,title:'Duplicate invoice detection',time:'about 4 hours',
 learn:[
  {h:'Why simple checks miss duplicates',p:'SAP can warn about duplicate invoices by comparing <b>vendor, reference number, date and amount</b>. But people type invoice numbers differently: <b>INV-1001</b>, <b>inv1001</b>, <b>INV 1001</b>. The system may not treat these as the same, and a duplicate is paid twice. So your test must <b>normalise</b> the invoice number first: remove spaces and punctuation, set to one case.'},
  {h:'Levels of test',p:'<b>Level 1</b>: exact match on vendor, invoice number and amount. <b>Level 2</b>: match after normalising the number. <b>Level 3</b>: <b>same vendor and amount with a different invoice number</b>: possible re-billing. Level 3 gives <b>leads</b> to investigate, not proven duplicates. Always report how many were <b>already paid</b>.'}],
 why:'Duplicate payments are a classic fraud and error risk, and a common data-analytics question.',
 sim:[],files:[DIX],
 lab:{intro:'Open <b>'+DIX+'</b>: 295 invoices. In Excel add a helper column to normalise INVOICE_NO: for example =UPPER(SUBSTITUTE(SUBSTITUTE(B2,"-","")," ","")).',tasks:[
  {q:'How many invoice rows are in the file?',t:'num',a:ANS.m2_rows,why:'Population.'},
  {q:'How many EXTRA rows are exact duplicates (same vendor, invoice number and amount as another row)?',t:'num',a:ANS.m2_exact,why:'Count the extra copies, not the originals.'},
  {q:'After normalising invoice numbers, how many extra duplicate rows are there in total?',t:'num',a:ANS.m2_norm,why:'Includes the format variants.'},
  {q:'How many duplicates were found ONLY because of normalising (not exact)?',t:'num',a:ANS.m2_variant,why:'The ones a simple check misses.'},
  {q:'How many vendor and amount combinations appear with DIFFERENT normalised invoice numbers (possible re-billing)?',t:'num',a:ANS.m2_potential,why:'Level 3 leads.'},
  {q:'Is a Level 3 match proof of a duplicate?',t:'mcq',o:['Yes','No, it is a lead to investigate','Only if paid'],a:1,why:'Two real invoices can share an amount.'}]},
 tb:[{title:'Explain how you test for duplicate invoices.',prompt:'How do you test whether the same invoice was paid twice?',model:'I take the full invoice population and test in levels. First an exact match on vendor, invoice number and amount. Then I normalise the invoice numbers by removing spaces and punctuation and setting one case, because typing differences hide duplicates. Then I look for the same vendor and amount with different invoice numbers. For each match I check whether both were paid, quantify the value, and investigate with the business. Level three results are leads, not proof.',pts:['Test the full population in levels','Exact match on vendor, invoice number and amount','Normalise invoice numbers to catch format variants','Look for same vendor and amount with a different number','Check if paid, quantify and investigate; leads are not proof']}],
 quiz:[
  {q:'INV-1001 and inv1001 are...',o:['Probably the same invoice typed differently','Always different','Always valid'],a:0,e:'Normalise before matching.'},
  {q:'Normalising means...',o:['Removing spaces and punctuation and fixing case','Deleting rows','Sorting'],a:0,e:'Make keys comparable.'},
  {q:'Same vendor and amount, different number, is...',o:['A lead to investigate','Proof of fraud','Normal'],a:0,e:'Investigate it.'},
  {q:'Report duplicates...',o:['With the amount already paid','Without amounts','Only the count'],a:0,e:'Money is the impact.'}]},

{id:'A3.3',trk:'A3',wk:TD,title:'Interface controls: reconciliation',time:'about 4 hours',
 learn:[
  {h:'The risks in an interface',p:'An <b>interface</b> moves data between systems (payroll to ledger, bank to finance). The risks: records are <b>lost</b>, amounts <b>change</b>, <b>errors</b> are not cleared, or the file is run <b>twice</b>. The key controls are <b>reconciliation of records and totals</b> between sender and receiver, and <b>error handling</b> that clears every rejected record.'},
  {h:'How to test',p:'For each batch compare <b>records sent and received</b> and <b>amounts sent and received</b>. Count unreconciled batches. Check <b>errors</b> were cleared. Look at which interface has most problems. Ask who reviews the reconciliation and whether differences are investigated and signed off. A reconciliation nobody reviews is not a control.'}],
 why:'Interfaces are where numbers quietly go missing. This is a favourite topic for both ITGC and application control interviews.',
 sim:[],files:[IRX],
 lab:{intro:'Open <b>'+IRX+'</b>: 90 interface batches in September 2026. Compare sent and received records and amounts.',tasks:[
  {q:'How many batches are in the file?',t:'num',a:ANS.m3_batches,why:'Population.'},
  {q:'How many batches have RECEIVED_RECORDS different from SENT_RECORDS?',t:'num',a:ANS.m3_rec,why:'Records lost or added.'},
  {q:'How many records were lost in total (sent minus received, added up)?',t:'num',a:ANS.m3_lost,why:'Sum of the differences.'},
  {q:'How many batches have a different amount sent and received?',t:'num',a:ANS.m3_amt,why:'Amount differences.'},
  {q:'What is the total amount difference (sent minus received, 2 decimal places)?',t:'num',a:ANS.m3_gap,why:'Size of the break.'},
  {q:'How many errors were reported in total?',t:'num',a:ANS.m3_errs,why:'Sum of ERRORS.'},
  {q:'How many batches had errors that were NOT cleared (ERRORS above 0 and ERRORS_CLEARED = N)?',t:'num',a:ANS.m3_uncl,why:'Open errors are open risk.'},
  {q:'Which interface has the most unreconciled batches (records or amount differ)?',t:'txt',a:ANS.m3_top,why:'Group by INTERFACE and count.'}]},
 tb:[{title:'Explain how you test an interface control.',prompt:'How do you test that an interface between two systems is complete and accurate?',model:'I identify the interface, the data it moves and the control owner. For each batch I compare records and amounts sent with those received, count unreconciled batches, and check that errors were investigated and cleared. I look at which interface has the most differences, ask who reviews the reconciliation and whether differences are signed off, and test a sample of differences to see how they were resolved. I report counts and amounts, and recommend automated reconciliation and alerts.',pts:['Identify the interface, data and control owner','Compare records and amounts sent and received for every batch','Check errors are investigated and cleared','Check someone reviews and signs off differences','Report counts and amounts and recommend automation']}],
 quiz:[
  {q:'A key interface control is...',o:['Reconciling sent and received totals','Renaming files','Printing logs'],a:0,e:'Completeness and accuracy.'},
  {q:'Uncleared errors mean...',o:['Records may be missing from the target','Nothing','Good control'],a:0,e:'Clear every error.'},
  {q:'A reconciliation nobody reviews is...',o:['Not an effective control','Excellent','Automatic'],a:0,e:'Needs a reviewer.'},
  {q:'Records sent 500, received 495 shows...',o:['5 records lost or rejected','Nothing','A faster run'],a:0,e:'Investigate.'}]},

{id:'A3.4',trk:'A3',wk:TD,title:'Configuration controls: tolerances and posting periods',time:'about 4 hours',
 learn:[
  {h:'Controls built into settings',p:'Many controls are <b>settings</b>, not procedures: <b>tolerance groups</b> (the maximum amount a user can post or approve), and <b>posting periods</b> (which months are open for posting). If the setting is wrong, every transaction is exposed. Test the setting against <b>policy</b>, then see <b>which users</b> are covered by the weak setting.'},
  {h:'Posting periods',p:'Prior periods must be <b>closed promptly</b> after month-end so figures cannot change after reporting. Compare the <b>closing date</b> with the policy (for example 10 days). Periods still open long after month-end, or closed late, are findings.'}],
 why:'A configuration finding scales: one wrong setting affects many users or transactions. That is why testers check it carefully.',
 sim:[],files:[TLX],
 lab:{intro:'Open <b>'+TLX+'</b>. <b>TOLERANCE_GROUPS</b> shows the document limit per group (blank means unlimited). <b>USERS</b> maps users to groups. <b>POSTING_PERIODS</b> shows period end and when each was closed (blank means still open). <b>POLICY</b> gives the rules.',tasks:[
  {q:'How many tolerance groups are there?',t:'num',a:ANS.m4_groups,why:'Rows in TOLERANCE_GROUPS.'},
  {q:'How many groups breach policy (document limit above 10,000 or unlimited)?',t:'num',a:ANS.m4_over,why:'Compare to the policy limit.'},
  {q:'How many groups are unlimited?',t:'num',a:ANS.m4_unl,why:'Blank limit.'},
  {q:'How many users are assigned to a group that breaches policy?',t:'num',a:ANS.m4_usersover,why:'Lookup user to group, then count.'},
  {q:'How many users are in an unlimited group?',t:'num',a:ANS.m4_usersunl,why:'Highest exposure.'},
  {q:'How many posting periods are listed?',t:'num',a:ANS.m4_periods,why:'Company codes times months.'},
  {q:'How many periods were closed MORE than 10 days after period end?',t:'num',a:ANS.m4_late,why:'CLOSED_ON minus PERIOD_END.'},
  {q:'How many periods are still open although the period ended more than 10 days before 30 Sep 2026?',t:'num',a:ANS.m4_open,why:'No close date and overdue.'}]},
 tb:[{title:'Explain how you test configuration controls such as tolerances and posting periods.',prompt:'How do you test controls that are system settings?',model:'I get the configuration directly from the system and compare it to the policy, for example the maximum tolerance limit and whether unlimited limits are allowed. I then find which users are assigned to the groups that breach policy, because that shows the exposure. For posting periods I compare the closing date with the policy and list periods closed late or still open. I report the settings, the users affected and the risk, and recommend changing the setting and reviewing assignments.',pts:['Get the configuration directly from the system','Compare to policy limits','Find users assigned to breaching groups','Compare posting period close dates with policy','Report exposure and recommend fixing the setting']}],
 quiz:[
  {q:'A tolerance group limits...',o:['The amount a user can post or approve','The number of users','Report size'],a:0,e:'Maximum amounts.'},
  {q:'An unlimited tolerance means...',o:['No amount limit','Zero limit','Locked user'],a:0,e:'Highest risk.'},
  {q:'Posting periods should be closed...',o:['Promptly after month-end','Never','Yearly'],a:0,e:'So figures cannot change.'},
  {q:'A configuration weakness...',o:['Affects every user covered by it','Affects one user','Does not matter'],a:0,e:'It scales.'}]},

{id:'A3.5',trk:'A3',wk:TD,title:'Master data: vendor bank changes and payments',time:'about 4 hours',
 learn:[
  {h:'The fraud pattern',p:'A common fraud is a <b>change to a vendor\'s bank account</b> followed by <b>a payment</b> to the new account. Controls: the change is <b>approved by someone independent</b>, the vendor is <b>called back on a known number</b> to confirm, and changes are <b>reviewed</b> afterwards. A change with no approval, self-approval or no call-back is high risk.'},
  {h:'How to test',p:'List the bank changes. Mark the <b>risky</b> ones (no approver, self-approved, no call-back). Then match to <b>payments</b> to the same vendor in the following <b>7 days</b>. Money paid after a risky change is the priority for investigation, because it may already have gone to a fraudster.'}],
 why:'Vendor master data is the entry point for payment fraud. Linking two datasets, changes and payments, is a strong analytics skill.',
 sim:[],files:[VBX],
 lab:{intro:'Open <b>'+VBX+'</b>. <b>BANK_CHANGES</b> lists changes to vendor bank accounts. <b>PAYMENTS</b> lists payments. A risky change has NO approver, is approved by the person who made it, or has no call-back (CALLBACK_DONE = N). Count payments made to the same vendor from the change date up to 7 days after it.',tasks:[
  {q:'How many bank changes are in the list?',t:'num',a:ANS.m5_chg,why:'Population.'},
  {q:'How many have NO approver?',t:'num',a:ANS.m5_noapr,why:'Unapproved change.'},
  {q:'How many were approved by the person who made the change?',t:'num',a:ANS.m5_self,why:'Not independent.'},
  {q:'How many had NO call-back?',t:'num',a:ANS.m5_nocb,why:'The key fraud control.'},
  {q:'How many changes are RISKY (any of the three problems above)?',t:'num',a:ANS.m5_risky,why:'Each change counted once.'},
  {q:'How many payments were made to a vendor within 0 to 7 days after ANY bank change to that vendor?',t:'num',a:ANS.m5_pays,why:'Match vendor, then compare dates.'},
  {q:'How many payments were made within 7 days after a RISKY change?',t:'num',a:ANS.m5_riskpays,why:'The priority list.'},
  {q:'What is the total value of those payments? (2 decimal places)',t:'num',a:ANS.m5_riskval,why:'Money at risk.'}]},
 tb:[{title:'Explain how you test vendor bank account changes.',prompt:'How do you test the control over changes to vendor bank details?',model:'I take the full log of vendor bank changes and check each has an independent approval and a call-back to the vendor on a known number. I mark risky changes: no approver, self-approved or no call-back. I then match the changes to payments to the same vendor in the following seven days, because money paid after a risky change is the priority. I investigate those payments, check whether the vendor confirms the account, and report counts, values and recommendations.',pts:['Get the full log of bank changes','Check independent approval and call-back','Mark risky changes','Match to payments to the same vendor soon after','Investigate, quantify and recommend']}],
 quiz:[
  {q:'The key control over a bank change is...',o:['Call-back to the vendor on a known number','A new email','A password'],a:0,e:'Confirm it is genuine.'},
  {q:'The highest-risk sequence is...',o:['A risky change then a payment','A payment then a change','A report'],a:0,e:'Money may go to a fraudster.'},
  {q:'Self-approval of a bank change is...',o:['Not independent','Fine','Faster'],a:0,e:'Needs another person.'},
  {q:'Linking two datasets shows...',o:['Risk that one alone would not','Nothing','More files'],a:0,e:'Changes plus payments.'}]},

{id:'A3.6',trk:'A3',wk:TD,title:'Report logic: re-performing a key report',time:'about 4 hours',
 learn:[
  {h:'Why re-perform',p:'Controls often rely on a <b>report</b> such as an ageing of overdue items. If the report logic is wrong, the control built on it fails. To rely on it, <b>re-perform</b> it: take the underlying data, apply the stated logic yourself, and compare to what the report says. Differences show errors in the logic or the data.'},
  {h:'How to re-perform',p:'Read the <b>report parameters</b> and the <b>stated rules</b> (as-of date, bucket boundaries). Recalculate each item\'s bucket in Excel with a formula. Compare to the reported bucket, count differences, and measure the <b>amount</b> in the key bucket both ways. Pay special attention to items shown as <b>Not due</b> that are really overdue: the report understates risk.'}],
 why:'Auditors will ask whether you can rely on a report. Re-performance is the clearest answer.',
 sim:[],files:[AGX],
 lab:{intro:'Open <b>'+AGX+'</b>: 220 open payables items with the bucket the report shows. <b>PARAMETERS</b> gives the as-of date (30 Sep 2026) and the bucket rules. Recalculate each bucket from DUE_DATE.',tasks:[
  {q:'How many open items are in the report?',t:'num',a:ANS.m6_items,why:'Population.'},
  {q:'How many items have a REPORT_BUCKET that differs from your recalculation?',t:'num',a:ANS.m6_wrong,why:'Errors in the report.'},
  {q:'How many items are truly in the 61+ bucket by your recalculation?',t:'num',a:ANS.m6_true61,why:'Days past due above 60.'},
  {q:'How many items does the report show in 61+?',t:'num',a:ANS.m6_rep61,why:'Count by REPORT_BUCKET.'},
  {q:'What is the true total of the 61+ bucket? (2 decimal places)',t:'num',a:ANS.m6_true61amt,why:'Sum of AMOUNT for recalculated 61+.'},
  {q:'What total does the report show for 61+? (2 decimal places)',t:'num',a:ANS.m6_rep61amt,why:'Sum by reported bucket.'},
  {q:'How many items are shown as Not due but are actually overdue?',t:'num',a:ANS.m6_hidden,why:'Understated risk.'},
  {q:'Can you rely on this report as it stands?',t:'mcq',o:['Yes, most items are right','No, the logic or data has errors that must be explained','Yes, totals are similar'],a:1,why:'Errors in key buckets mean you cannot rely on it.'}]},
 tb:[{title:'Explain how you re-perform a report before relying on it.',prompt:'A control uses an ageing report. How do you decide whether you can rely on the report?',model:'I document the report parameters and the stated logic, including the as-of date and the bucket boundaries. I get the underlying data and recalculate each item myself, then compare my result with the report, counting differences and comparing the totals in the key buckets. I pay particular attention to overdue items shown as not due. If I find differences I ask the client to explain them, and I do not rely on the report until they are resolved. I document the re-performance and the conclusion.',pts:['Document the parameters and stated logic','Recalculate every item from the underlying data','Compare counts and totals in key buckets','Look especially for overdue items shown as not due','Do not rely until differences are explained, and document']}],
 quiz:[
  {q:'Re-performance means...',o:['Recalculating the report yourself','Reading the report','Asking for a new report'],a:0,e:'Apply the logic to the data.'},
  {q:'Overdue items shown as Not due...',o:['Understate risk','Overstate risk','Are fine'],a:0,e:'A serious flaw.'},
  {q:'Before re-performing you note...',o:['The parameters and rules','The auditor\'s name','The file size'],a:0,e:'As-of date and buckets.'},
  {q:'If differences cannot be explained...',o:['Do not rely on the report','Rely anyway','Delete them'],a:0,e:'Document and escalate.'}]}
];
