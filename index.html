const TVA='Track A4. Vendor tools (concepts)';
const V1X='Thornfield_Adv_GRC_AC_Risk_Report.xlsx',V2X='Thornfield_Adv_GRC_PC_Test_Results.xlsx',V3X='Thornfield_Adv_GRC_IAG_Requests.xlsx';
const VN=' <i>This unit teaches what the tool does and what evidence it gives. It does not show exact screens or menu paths, which differ by version. Check product details with your own system or an SME.</i>';
[
{id:'A4.1',trk:'A4',wk:TVA,title:'SAP GRC Access Control: risk analysis and mitigation',time:'about 4 hours',
 learn:[
  {h:'What it does',p:'SAP GRC <b>Access Control</b> checks user access against a <b>rule set</b> of risks (for example, create a vendor and pay an invoice). Its main parts: <b>Access Risk Analysis</b> (finds conflicts), <b>Access Request Management</b> (approval workflow for new access), <b>Emergency Access Management</b> (firefighter access with logging), and <b>Business Role Management</b> (role design and testing).'},
  {h:'What you ask for as a tester',p:'Ask for the <b>risk analysis report</b> by user and by role, the <b>rule set version</b> and when it was last changed, the list of <b>mitigating controls</b> with owners and valid-to dates, and the <b>firefighter log</b> with reviewer sign-off. Then test: <b>is the rule set complete</b>, <b>are conflicts mitigated</b>, and <b>is each mitigation still valid and actually operating</b>?'},
  {h:'Typical findings',p:'<b>Unmitigated</b> high-risk conflicts; <b>expired mitigations</b> still shown as mitigated; mitigating controls that are <b>never performed</b>; a <b>rule set</b> that misses key transactions; and access granted <b>outside the workflow</b>.'}],
 why:'Interviewers often ask what you would test in Access Control. Naming the report, the evidence and the typical findings shows you understand the tool, not just the risk.',
 sim:[],files:[V1X],
 lab:{intro:'Open <b>'+V1X+'</b>: a mock risk analysis report with 48 violations. Report date: <b>14 Oct 2026</b>. A mitigation is valid only if MITIGATION_VALID_TO is on or after the report date.'+VN,tasks:[
  {q:'How many violations are in the report?',t:'num',a:ANS.v1_total,why:'Population.'},
  {q:'How many different users have violations?',t:'num',a:ANS.v1_users,why:'Distinct USER.'},
  {q:'How many violations are NOT mitigated?',t:'num',a:ANS.v1_unm,why:'MITIGATED = N.'},
  {q:'How many of those unmitigated violations are High risk?',t:'num',a:ANS.v1_hunm,why:'Priority for remediation.'},
  {q:'How many violations are marked mitigated but the mitigation has EXPIRED?',t:'num',a:ANS.v1_exp,why:'Valid-to before report date.'},
  {q:'How many violations have no VALID mitigation (unmitigated plus expired)?',t:'num',a:ANS.v1_eff,why:'The true exposure.'},
  {q:'Which RISK_ID appears most often? (e.g. F001)',t:'txt',a:ANS.v1_toprisk,why:'Where the rule set bites most.'},
  {q:'What percentage of violations have a valid mitigation? (2 decimal places)',t:'num',a:ANS.v1_pct,why:'Valid divided by total.'},
  {q:'The report shows a conflict as mitigated. What should you test next?',t:'mcq',o:['Nothing, the tool says mitigated','That the mitigating control is valid and actually performed','The server name'],a:1,why:'A label is not evidence.'}]},
 tb:[{title:'Explain how you would test access risk in SAP GRC Access Control.',prompt:'The auditor asks what you will test in Access Control. What do you say?',model:'I would ask for the risk analysis report by user and role, the rule set version and its change history, the list of mitigating controls with owners and valid-to dates, and the firefighter log. I would check the rule set covers the key risks, that every conflict is either removed or mitigated, that each mitigation is still valid and the control is actually performed with evidence, and that new access goes through the request workflow. Unmitigated high-risk conflicts and expired mitigations are the main findings.',pts:['Ask for risk report, rule set, mitigations and firefighter log','Check rule set coverage and change history','Every conflict removed or mitigated','Mitigation valid and actually performed','New access goes through the workflow']}],
 quiz:[
  {q:'Access Risk Analysis finds...',o:['Conflicting access','Broken servers','Late invoices'],a:0,e:'Rules match access.'},
  {q:'An expired mitigation means...',o:['The conflict is effectively unmitigated','All is fine','The user left'],a:0,e:'Valid-to matters.'},
  {q:'Emergency Access Management covers...',o:['Firefighter access with logging','Payroll','Backups'],a:0,e:'Logged elevated access.'},
  {q:'First evidence to request...',o:['Risk report and rule set','Lunch menu','Logo'],a:0,e:'Start with the source.'}]},
{id:'A4.2',trk:'A4',wk:TVA,title:'SAP GRC Process Control: tests, issues and sign-off',time:'about 4 hours',
 learn:[
  {h:'What it does',p:'SAP GRC <b>Process Control</b> holds the <b>control library</b> (each control with an owner and frequency), schedules <b>tests</b> and <b>self-assessments</b>, records <b>results</b>, and tracks <b>issues</b> to closure. It supports <b>continuous monitoring</b> where controls can be tested automatically from system data, and management <b>sign-off</b> each period.'},
  {h:'What you ask for as a tester',p:'Ask for the <b>control library</b> and any changes, the <b>test plan</b> and schedule, <b>test results</b> with evidence attached, the <b>issue list</b> with status and owners, and <b>sign-off</b> records. Test whether the plan <b>covers all key controls</b>, tests were done <b>on time and by an independent person</b>, results are <b>supported</b>, and failed controls have <b>issues that are followed up</b>.'},
  {h:'Typical findings',p:'Controls <b>not tested</b> by the due date; failed controls with <b>no issue</b> or an issue left <b>open</b> too long; results marked pass with <b>no evidence</b>; and testers who are <b>not independent</b> of the owner.'}],
 why:'Process Control questions test whether you can read a status report and spot gaps. The fail rate, overdue tests and open issues are what a manager looks at first.',
 sim:[],files:[V2X],
 lab:{intro:'Open <b>'+V2X+'</b>: 45 controls with test due date, test date, result and issue status. Report date: <b>14 Oct 2026</b>. Result "Not tested" means no test yet.'+VN,tasks:[
  {q:'How many controls are in the report?',t:'num',a:ANS.v2_total,why:'Population.'},
  {q:'How many controls are NOT tested?',t:'num',a:ANS.v2_nt,why:'Result = Not tested.'},
  {q:'How many controls FAILED?',t:'num',a:ANS.v2_fail,why:'Result = Fail.'},
  {q:'How many untested controls are OVERDUE (test due before the report date)?',t:'num',a:ANS.v2_over,why:'Missed schedule.'},
  {q:'What is the fail rate of controls that were TESTED? (2 decimal places, percent)',t:'num',a:ANS.v2_rate,why:'Fails divided by tested.'},
  {q:'How many failed controls still have an OPEN issue?',t:'num',a:ANS.v2_open,why:'Needs follow-up.'},
  {q:'Which process has the most failed controls? (first word, e.g. procure)',t:'txt',a:ANS.v2_top,why:'Where to focus.'},
  {q:'A control shows Pass but has no evidence attached. What do you do?',t:'mcq',o:['Accept the result','Treat the result as unsupported and ask for evidence','Delete the control'],a:1,why:'A result needs support.'}]},
 tb:[{title:'Explain how you would test the testing process in SAP GRC Process Control.',prompt:'Management relies on Process Control results. How do you check them?',model:'I would ask for the control library, the test plan, the results with attached evidence, the issue list and the sign-off records. I would check the plan covers every key control, tests were done on time by someone independent of the owner, results are supported by evidence, and every failed control has an issue that is tracked to closure. Overdue tests, failed controls with open issues and passes with no evidence are the main findings.',pts:['Ask for library, plan, results, issues and sign-off','Plan covers all key controls','Tests on time and independent','Results supported by evidence','Failed controls have issues followed to closure']}],
 quiz:[
  {q:'Process Control holds...',o:['A control library and test results','Payroll','Email'],a:0,e:'Controls and tests.'},
  {q:'A failed control needs...',o:['An issue followed to closure','Nothing','Deletion'],a:0,e:'Track remediation.'},
  {q:'Continuous monitoring means...',o:['Automatic testing from system data','Yearly tests only','No testing'],a:0,e:'Less manual work.'},
  {q:'A tester should be...',o:['Independent of the owner','The owner','Anyone'],a:0,e:'Independence.'}]},
{id:'A4.3',trk:'A4',wk:TVA,title:'SAP Cloud Identity Access Governance (IAG): requests and approvals',time:'about 4 hours',
 learn:[
  {h:'What it does',p:'SAP <b>Cloud Identity Access Governance</b> (Cloud IAG) is the cloud-based service for access governance. Its main parts cover <b>access analysis</b> (conflicts and critical access), <b>access request</b> workflows, <b>role design</b>, <b>privileged access</b> management and <b>certification</b> (access reviews). It suits cloud and hybrid landscapes, including RISE.'},
  {h:'What you ask for as a tester',p:'Ask for the <b>request log</b> with requester, approver and timestamps, the <b>approval rules</b> by risk level, <b>certification campaign</b> results, the <b>privileged access</b> log, and the <b>connected systems</b> list. Test whether <b>every system is connected</b>, high-risk requests have the <b>risk owner approval</b>, requests meet the <b>service time</b>, and reviews are <b>completed</b>.'},
  {h:'Typical findings',p:'<b>High-risk access approved</b> without risk-owner approval; requests <b>finished late</b>; systems <b>not connected</b> to the service; reviews <b>never completed</b>; and access granted <b>outside the tool</b>.'}],
 why:'Companies are moving access governance to the cloud. Knowing what evidence Cloud IAG gives, and which approvals to test, shows you can handle both old and new landscapes.',
 sim:[],files:[V3X],
 lab:{intro:'Open <b>'+V3X+'</b>: 42 access requests. Rules are on the RULES sheet: complete within 5 calendar days; High risk may only be approved with risk owner approval.'+VN,tasks:[
  {q:'How many requests are in the log?',t:'num',a:ANS.v3_total,why:'Population.'},
  {q:'How many were APPROVED?',t:'num',a:ANS.v3_app,why:'STATUS = Approved.'},
  {q:'How many were REJECTED?',t:'num',a:ANS.v3_rej,why:'STATUS = Rejected.'},
  {q:'How many are still PENDING?',t:'num',a:ANS.v3_pend,why:'No completed date.'},
  {q:'How many completed requests took MORE than 5 calendar days (completed minus created)?',t:'num',a:ANS.v3_sla,why:'Service time breaches.'},
  {q:'How many APPROVED High risk requests do NOT have risk owner approval?',t:'num',a:ANS.v3_hnoown,why:'Breaks the approval rule.'},
  {q:'What is the average days to complete, for completed requests? (2 decimal places)',t:'num',a:ANS.v3_avg,why:'Completed minus created.'},
  {q:'Which department raised the most requests? (e.g. finance)',t:'txt',a:ANS.v3_top,why:'Where the volume is.'},
  {q:'A high-risk role was approved without the risk owner. What is this?',t:'mcq',o:['A control exception to report','Normal','Not worth noting'],a:0,why:'The approval rule was bypassed.'}]},
 tb:[{title:'Explain how you would test access requests in Cloud IAG.',prompt:'The auditor asks how you will test new access approvals in the cloud tool.',model:'I would ask for the request log with requester, approver and timestamps, the approval rules by risk level, the certification results, the privileged access log and the list of connected systems. I would check every in-scope system is connected, high-risk requests have the risk owner approval, requests finish within the agreed service time, and access reviews are completed. Approved high-risk requests without the risk owner, late requests and unconnected systems are the main findings.',pts:['Ask for request log, rules, certification and privileged log','Check every in-scope system is connected','High-risk needs risk owner approval','Requests meet service time','Reviews completed']}],
 quiz:[
  {q:'Cloud IAG is used for...',o:['Access governance in cloud and hybrid','Printing','Payroll'],a:0,e:'Cloud access governance.'},
  {q:'High-risk access needs...',o:['Risk owner approval','No approval','Only the requester'],a:0,e:'Per the rule.'},
  {q:'Systems not connected means...',o:['Their access is not governed','All fine','Faster'],a:0,e:'Coverage gap.'},
  {q:'Certification is...',o:['Periodic access review','A diploma','A backup'],a:0,e:'Reviews of access.'}]}
].forEach(u=>UNITS.push(u));
const TE='Track B1. SOX 404 and PCAOB expectations';
const SAX='Thornfield_Adv_SOX_Applicability.xlsx',SMX='Thornfield_Adv_Scoping_Materiality.xlsx',COX='Thornfield_Adv_COSO_Mapping.xlsx',DEX='Thornfield_Adv_Deficiency_Eval.xlsx',ROX='Thornfield_Adv_Reliance_On_Others.xlsx';
const NOTE=' <i>The rules in the exercise file are simplified for practice. On a real engagement follow the firm methodology and the current text of the standards.</i>';
const SU=[
{id:'B1.1',trk:'B1',wk:TE,title:'SOX in plain terms: 302, 404(a), 404(b) and who is covered',time:'about 3 hours',
 learn:[
  {h:'The sections that matter to a tester',p:'<b>Section 302</b>: the CEO and CFO <b>certify</b> each periodic report, including that they are responsible for <b>disclosure controls</b> and have told the auditors and the audit committee about significant deficiencies, material weaknesses and any fraud involving management. <b>Section 404(a)</b>: <b>management</b> reports on the effectiveness of <b>internal control over financial reporting (ICFR)</b> in the annual report. <b>Section 404(b)</b>: the <b>external auditor attests</b> to ICFR, an <b>integrated audit</b> of financial statements and ICFR. <b>Section 906</b> adds criminal penalties for false certification.'},
  {h:'Who is covered',p:'Section 302 and 404(a) apply to <b>all SEC registrants</b> filing annual reports. <b>404(b)</b> attestation applies to <b>larger filers</b> (by public float); smaller non-accelerated filers are exempt, and <b>emerging growth companies</b> are exempt. A <b>newly public</b> company does not need the management report or attestation until its second annual report. <b>ICFR</b> is measured against a framework, usually <b>COSO 2013</b>. <b>Check the current SEC definitions</b>, as thresholds and exemptions change.'}],
 why:'Interviewers test whether you know who does what: management assesses (404a), the auditor attests (404b), and why a control tester\'s work matters for both.',
 sim:[],files:[SAX],
 lab:{intro:'Open <b>'+SAX+'</b>: 40 companies with public float (USD millions), whether they are an emerging growth company (EGC), and whether this is their first annual report after listing. Use the rules in <b>EXERCISE_RULES</b>.'+NOTE,tasks:[
  {q:'How many companies are in the list?',t:'num',a:ANS.n1_cos,why:'Population.'},
  {q:'How many companies must give a management report on ICFR (404(a)), under the exercise rule?',t:'num',a:ANS.n1_a,why:'All except those in their first annual report.'},
  {q:'How many companies also need auditor attestation (404(b))?',t:'num',a:ANS.n1_b,why:'404(a) applies, float at or above 75 million and not an EGC.'},
  {q:'How many companies need 404(a) but are EXEMPT from 404(b)?',t:'num',a:ANS.n1_exb,why:'The difference.'},
  {q:'How many companies are in their FIRST annual report?',t:'num',a:ANS.n1_first,why:'They get a transition period.'},
  {q:'How many companies have a public float of 700 million or more?',t:'num',a:ANS.n1_big,why:'The largest filers.'},
  {q:'What is the total public float of the companies that need 404(b)? (USD millions, 1 decimal place)',t:'num',a:ANS.n1_float,why:'Sum for the 404(b) group.'},
  {q:'Which statement is right?',t:'mcq',o:['Only the auditor assesses ICFR','Management assesses ICFR; the auditor attests for larger filers','404(b) applies to every company'],a:1,why:'404(a) management, 404(b) auditor attestation.'}]},
 tb:[{title:'Explain SOX 302, 404(a) and 404(b) in plain words.',prompt:'A friend asks what SOX requires and who does what. Explain it simply.',model:'Section 302 requires the CEO and CFO to certify each periodic report, including that they are responsible for disclosure controls and have told the auditors and audit committee about significant deficiencies, material weaknesses and any fraud involving management. Section 404(a) requires management to assess and report on the effectiveness of internal control over financial reporting each year, against a framework such as COSO. Section 404(b) requires the external auditor to give an opinion on ICFR for larger filers, together with the financial statement audit. Smaller and newly public companies have exemptions or transition periods, which I would check.',pts:['302: CEO and CFO certify, including disclosure controls and deficiencies reported','404(a): management assesses and reports on ICFR','404(b): auditor attests for larger filers','ICFR is assessed against a framework such as COSO','Exemptions and transition periods exist and must be checked']}],
 quiz:[
  {q:'Who makes the 404(a) assessment?',o:['Management','The external auditor','The SEC'],a:0,e:'Management reports on ICFR.'},
  {q:'404(b) is...',o:['Auditor attestation on ICFR','A tax rule','A banking rule'],a:0,e:'For larger filers.'},
  {q:'Section 302 involves...',o:['CEO and CFO certification','Only the auditor','Only IT'],a:0,e:'Personal certification.'},
  {q:'A newly public company typically...',o:['Has a transition before the first ICFR report','Reports at once','Is exempt forever'],a:0,e:'From the second annual report.'}]},

{id:'B1.2',trk:'B1',wk:TE,title:'Top-down scoping: materiality, accounts and locations',time:'about 3 hours',
 learn:[
  {h:'Top-down and risk-based',p:'The PCAOB integrated audit standard (<b>AS 2201</b>) calls for a <b>top-down, risk-based</b> approach. Start with <b>entity-level controls</b>, then identify <b>significant accounts and disclosures</b> and their <b>relevant assertions</b>, then the processes and <b>key controls</b> that address the risks of material misstatement. Do not start by listing every control.'},
  {h:'Materiality and coverage',p:'Set <b>planning materiality</b> (often a percentage of a benchmark such as pre-tax income), then <b>performance materiality</b> (a lower amount to leave room for errors). An account is <b>significant</b> if it could contain a misstatement that is material, alone or with others, <b>or</b> if it carries a high risk even when the balance is smaller (for example estimates or fraud-prone areas). For <b>locations</b>, cover the largest first until you reach the target share of revenue or assets, then consider smaller locations with specific risks.'}],
 why:'Scoping decides how much work is done. Showing you can scope with numbers is a strong sign of seniority.',
 sim:[],files:[SMX],
 lab:{intro:'Open <b>'+SMX+'</b>. <b>ACCOUNTS</b>, <b>LOCATIONS</b> and <b>PARAMETERS</b> give the pre-tax income and rules. Planning materiality is 5% of pre-tax income; performance materiality is 75% of that.'+NOTE,tasks:[
  {q:'What is planning materiality?',t:'num',a:ANS.s2_pl,why:'5% of pre-tax income.'},
  {q:'What is performance materiality?',t:'num',a:ANS.s2_pm,why:'75% of planning materiality.'},
  {q:'How many accounts have a balance at or above performance materiality?',t:'num',a:ANS.s2_over,why:'Quantitative scoping.'},
  {q:'How many accounts are below performance materiality but rated High risk?',t:'num',a:ANS.s2_highbelow,why:'Qualitative scoping.'},
  {q:'How many accounts are IN scope in total (balance at or above PM, or High risk)?',t:'num',a:ANS.s2_scope,why:'Add the two groups, without double counting.'},
  {q:'How many accounts are out of scope?',t:'num',a:ANS.s2_out,why:'Document why.'},
  {q:'Taking the largest locations first, how many locations are needed to reach at least 75% of total revenue?',t:'num',a:ANS.s2_locs,why:'Add largest first until the share reaches 75%.'},
  {q:'What share of revenue do those locations cover? (percentage, 2 decimal places)',t:'num',a:ANS.s2_cov,why:'Covered revenue divided by total revenue.'}]},
 tb:[{title:'Explain how you scope an ICFR assessment top-down.',prompt:'How do you decide which accounts, controls and locations are in scope?',model:'I start from the financial statements and set planning and performance materiality from a benchmark such as pre-tax income. I identify significant accounts and disclosures, both those above performance materiality and smaller ones with high risk, and their relevant assertions. I understand the entity-level controls, then the processes and the key controls that address the risks. For locations I cover the largest first up to my target share of revenue or assets, then add smaller ones with specific risks. I document what is out of scope and why.',pts:['Set planning and performance materiality from a benchmark','Identify significant accounts by size and by risk','Link to relevant assertions, processes and key controls','Cover the largest locations first to a target share, then add risky ones','Document what is out of scope and why']}],
 quiz:[
  {q:'Top-down starts with...',o:['The financial statements and risks','Every control','IT only'],a:0,e:'Risk-based.'},
  {q:'Performance materiality is...',o:['Lower than planning materiality','Higher','Equal'],a:0,e:'It leaves room for undetected errors.'},
  {q:'A small account can be in scope if...',o:['The risk is high','It is alphabetical','Never'],a:0,e:'Qualitative factors count.'},
  {q:'Out-of-scope accounts should be...',o:['Documented with the reason','Ignored','Deleted'],a:0,e:'Show your reasoning.'}]},

{id:'B1.3',trk:'B1',wk:TE,title:'Entity-level controls and the COSO 2013 framework',time:'about 3 hours',
 learn:[
  {h:'Five components, 17 principles',p:'<b>COSO 2013</b> has <b>five components</b>: <b>control environment</b> (principles 1 to 5), <b>risk assessment</b> (6 to 9), <b>control activities</b> (10 to 12), <b>information and communication</b> (13 to 15) and <b>monitoring activities</b> (16 and 17). For an effective system of internal control, all five components and the relevant principles must be <b>present and functioning</b> and operate together.'},
  {h:'How testers use it',p:'<b>Entity-level controls</b> (tone at the top, board oversight, fraud risk assessment, monitoring) sit above individual processes. Map your entity-level controls to the 17 principles to find <b>gaps</b>: a principle with no control mapped, or whose controls were <b>never tested</b>, is a risk to your conclusion. Remember these controls are often judgemental, so the evidence is documents, minutes and inquiry, not just data.'}],
 why:'Candidates who can name the components and map controls to principles show framework knowledge beyond process-level testing.',
 sim:[],files:[COX],
 lab:{intro:'Open <b>'+COX+'</b>. <b>PRINCIPLES</b> lists the 17 COSO principles with their component. <b>CONTROLS</b> maps 36 entity-level controls to a principle, with whether tested and the result.',tasks:[
  {q:'How many entity-level controls are listed?',t:'num',a:ANS.n3_cons,why:'Rows in CONTROLS.'},
  {q:'How many principles have NO control mapped?',t:'num',a:ANS.n3_unmapped,why:'Gaps in the framework coverage.'},
  {q:'Which COSO component has the most unmapped principles? (e.g. monitoring activities)',t:'txt',a:ANS.n3_comp,why:'Look up each unmapped principle\'s component.'},
  {q:'How many controls were NOT tested (TESTED = N)?',t:'num',a:ANS.n3_untested,why:'Untested means no conclusion.'},
  {q:'How many controls were tested and found Deficient?',t:'num',a:ANS.n3_deficient,why:'TESTED = Y and RESULT = Deficient.'},
  {q:'How many principles have controls mapped but NONE of them tested?',t:'num',a:ANS.n3_notest,why:'No evidence for that principle.'},
  {q:'How many principles are in the COSO 2013 framework?',t:'num',a:17,why:'Five components, 17 principles.'}]},
 tb:[{title:'Explain the COSO 2013 framework and how you use it.',prompt:'Describe COSO 2013 and how you would use it when assessing internal control.',model:'COSO 2013 describes internal control through five components: control environment, risk assessment, control activities, information and communication, and monitoring activities, supported by 17 principles. For an effective system all components and relevant principles must be present and functioning together. When assessing, I map the entity-level controls to the principles to find gaps, such as principles with no control or with controls that were never tested, and I evaluate the results of the controls that were tested. Entity-level controls are judgemental, so I rely on documents, minutes and inquiry as evidence.',pts:['Five components: environment, risk assessment, control activities, information and communication, monitoring','17 principles supporting the components','All components must be present and functioning together','Map controls to principles to find gaps and untested areas','Evidence for entity-level controls is documents, minutes and inquiry']}],
 quiz:[
  {q:'How many components does COSO 2013 have?',o:['Five','Three','Seven'],a:0,e:'Five components.'},
  {q:'How many principles?',o:['17','5','12'],a:0,e:'Seventeen principles.'},
  {q:'Tone at the top belongs to...',o:['The control environment','Monitoring','Control activities'],a:0,e:'Principles 1 to 5.'},
  {q:'A principle with no mapped control is...',o:['A gap to evaluate','Fine','Out of scope always'],a:0,e:'Find out why.'}]},

{id:'B1.4',trk:'B1',wk:TE,title:'Evaluating deficiencies: deficiency, significant deficiency, material weakness',time:'about 3 hours',
 learn:[
  {h:'The three levels',p:'A <b>control deficiency</b> exists when a control does not allow timely prevention or detection of misstatements. A <b>significant deficiency</b> is less severe than a material weakness but important enough to merit the attention of those overseeing financial reporting. A <b>material weakness</b> is a deficiency, or combination, such that there is a <b>reasonable possibility</b> that a <b>material misstatement</b> will not be prevented or detected on a timely basis.'},
  {h:'How severity is judged',p:'Severity depends on two things: whether there is a <b>reasonable possibility</b> a control will fail to prevent or detect a misstatement, and the <b>magnitude</b> of the potential misstatement, not on whether a misstatement actually occurred. <b>Compensating controls</b> that work at the right precision can reduce severity. Deficiencies affecting the <b>same account or assertion</b> must be <b>considered together</b>. Indicators of a material weakness include fraud by senior management, a restatement, and ineffective audit committee oversight.'}],
 why:'This is the step every lead gets asked about: how did you decide it was a material weakness and not just a deficiency?',
 sim:[],files:[DEX],
 lab:{intro:'Open <b>'+DEX+'</b>: 18 deficiencies with the account, potential misstatement, likelihood and whether an effective compensating control exists. Apply the steps in <b>RULES</b>. Materiality is 2,600,000 and performance materiality is 1,950,000.'+NOTE,tasks:[
  {q:'How many deficiencies are in the list?',t:'num',a:ANS.n4_defs,why:'Population.'},
  {q:'How many deficiencies go forward to step 3 (reasonably possible and NO effective compensating control)?',t:'num',a:ANS.n4_cand,why:'The others are Control deficiency.'},
  {q:'What is the largest account total among those deficiencies (after adding up by account)?',t:'num',a:ANS.n4_top,why:'Sum potential misstatement for each account.'},
  {q:'How many ACCOUNTS have a total at or above materiality?',t:'num',a:ANS.n4_mwacc,why:'Material weakness at account level.'},
  {q:'How many deficiencies are classed as Material weakness?',t:'num',a:ANS.n4_mw,why:'Every deficiency in an account whose total is at or above materiality.'},
  {q:'How many deficiencies are classed as Significant deficiency?',t:'num',a:ANS.n4_sd,why:'Account total at or above PM, below materiality.'},
  {q:'How many are only a Control deficiency?',t:'num',a:ANS.n4_cd,why:'The rest.'},
  {q:'How many deficiencies on their own are below performance materiality but sit in an account whose total is at or above performance materiality?',t:'num',a:ANS.n4_lift,why:'Aggregation raises severity.'}]},
 tb:[{title:'Explain how you evaluate the severity of control deficiencies.',prompt:'You found several deficiencies. How do you decide whether they are a material weakness?',model:'I ask two questions: is there a reasonable possibility that the control fails to prevent or detect a misstatement, and how large could the misstatement be, based on potential, not actual, error. I consider compensating controls that operate at the right level of precision. I group deficiencies that affect the same account or assertion, because they can be a material weakness together. I also look at indicators such as fraud by senior management, a restatement or weak audit committee oversight. I document my reasoning and communicate to management and the audit committee.',pts:['Reasonable possibility of failure','Magnitude of the potential misstatement, not the actual','Consider compensating controls','Aggregate deficiencies in the same account or assertion','Check indicators, document reasoning and communicate']}],
 quiz:[
  {q:'A material weakness requires...',o:['A reasonable possibility of a material misstatement not being prevented or detected','An actual misstatement','A fraud'],a:0,e:'Potential, not actual.'},
  {q:'Deficiencies in the same account are...',o:['Considered together','Considered separately only','Ignored'],a:0,e:'They can combine.'},
  {q:'A compensating control...',o:['Can reduce severity if it works precisely enough','Always removes the finding','Is never relevant'],a:0,e:'Evaluate it.'},
  {q:'A restatement is...',o:['An indicator of a material weakness','Unrelated','Good news'],a:0,e:'A recognised indicator.'}]},

{id:'B1.5',trk:'B1',wk:TE,title:'Using the work of others and roll-forward',time:'about 3 hours',
 learn:[
  {h:'Using the work of others',p:'The PCAOB standard allows the auditor to use the work of <b>internal audit or management</b> in testing controls, but the auditor must evaluate the <b>competence and objectivity</b> of those people, and the auditor\'s <b>own work must provide the principal evidence</b> for the opinion. The <b>higher the risk</b> of a control, the <b>less</b> the auditor can rely on others and the more must be tested directly. Management cannot be objective about its own controls.'},
  {h:'Interim testing and roll-forward',p:'Controls are often tested at an <b>interim date</b> before year-end. The auditor must then <b>roll forward</b>: obtain evidence that the control continued to operate from the interim date to year-end, with more work for higher risk. Without a roll-forward, an interim test does not cover the whole period.'}],
 why:'Efficiency and quality both depend on this. A lead who plans reliance and roll-forward properly saves effort without weakening the audit.',
 sim:[],files:[ROX],
 lab:{intro:'Open <b>'+ROX+'</b>: 40 key controls with risk, who tested them, their competence and objectivity ratings, and whether interim tested and rolled forward. Apply <b>EXERCISE_RULES</b>.'+NOTE,tasks:[
  {q:'How many controls are in the list?',t:'num',a:ANS.n5_ctl,why:'Population.'},
  {q:'How many controls are rated High risk?',t:'num',a:ANS.n5_high,why:'These must be tested directly.'},
  {q:'How many High-risk controls were tested by someone other than the Auditor (a breach of the rule)?',t:'num',a:ANS.n5_breach,why:'Retest them directly.'},
  {q:'How many controls were tested by Management?',t:'num',a:ANS.n5_mgmt,why:'Not objective.'},
  {q:'How many controls tested by others (not Auditor) CAN be relied on (not High risk, and both competence and objectivity Adequate)?',t:'num',a:ANS.n5_ok,why:'The eligible group.'},
  {q:'How many controls tested by others can NOT be relied on?',t:'num',a:ANS.n5_notok,why:'These need re-testing or extra work.'},
  {q:'How many controls were tested at interim but NOT rolled forward?',t:'num',a:ANS.n5_nrf,why:'INTERIM_TESTED = Y and ROLLFORWARD_DONE = N.'},
  {q:'How many of those are High risk?',t:'num',a:ANS.n5_hnrf,why:'Priority for roll-forward work.'}]},
 tb:[{title:'Explain how you decide how far to rely on the work of others.',prompt:'Internal audit has already tested many controls. How do you decide whether to use their work?',model:'I evaluate the competence and objectivity of the people who did the work, and I remember that management is not objective about its own controls. The higher the risk of the control, the less I rely on others and the more I test myself, and my own work must provide the principal evidence for the opinion. For controls I can rely on, I reperform some of the work. I also check that controls tested at interim have a roll-forward to year-end, with more work for higher-risk controls, and I document my conclusions.',pts:['Evaluate competence and objectivity','Management is not objective about its own controls','Higher risk means less reliance and more direct testing','My own work provides the principal evidence','Roll forward interim testing to year-end and document']}],
 quiz:[
  {q:'Work of others requires assessing...',o:['Competence and objectivity','Cost only','Speed only'],a:0,e:'Both matter.'},
  {q:'For high-risk controls the auditor...',o:['Relies less on others','Relies fully on others','Skips testing'],a:0,e:'More direct testing.'},
  {q:'A roll-forward covers...',o:['Interim date to year-end','Year-end to next year','Only the first month'],a:0,e:'The rest of the period.'},
  {q:'Management testing its own controls is...',o:['Not objective','Fully objective','Required'],a:0,e:'Self-review threat.'}]}
];

const TF='Track B2. ISAE 3402, SOC 1 and SOC 2';
const ARX2='Thornfield_Adv_Assurance_Register.xlsx',T2X='Thornfield_Adv_Type2_Results.xlsx',CUX='Thornfield_Adv_CUEC_Mapping.xlsx',S2X='Thornfield_Adv_SOC2_Criteria.xlsx';
const N2=' <i>The rules in the exercise file are simplified for practice. On a real engagement follow the firm methodology and the current standards.</i>';
const SV=[
{id:'B2.1',trk:'B2',wk:TF,title:'Which report is it? SOC 1, SOC 2, ISAE 3402 and usability',time:'about 3 hours',
 learn:[
  {h:'The report types',p:'<b>SOC 1</b> and <b>ISAE 3402</b> report on a service organisation\'s controls <b>relevant to its customers\' financial reporting</b>: they are what an ICFR audit uses. <b>SOC 2</b> reports on controls against the <b>Trust Services Criteria</b> (security, availability, processing integrity, confidentiality, privacy): relevant for security and cloud assurance, <b>not</b> specifically for financial reporting. <b>SOC 3</b> is a short public version. <b>Type 1</b> reports on the <b>design</b> of controls at a <b>point in time</b>. <b>Type 2</b> reports on design <b>and operating effectiveness over a period</b>.'},
  {h:'Is the report usable?',p:'Before relying, check: the <b>right type</b> (Type 2 for operating effectiveness), a <b>long enough period</b>, an <b>unqualified opinion</b>, scope that covers the <b>services and systems you use</b>, and whether the period leaves a <b>gap to your year-end</b>. If the period ends well before year-end you need a <b>bridge letter</b> and may need more work. Also note how <b>subservice organisations</b> are treated (carve-out or inclusive).'}],
 why:'Picking the wrong type of report is a classic error. Interviewers ask how you would decide whether a vendor report can be relied on.',
 sim:[],files:[ARX2],
 lab:{intro:'Open <b>'+ARX2+'</b>: a register of 25 vendor assurance reports. Apply <b>EXERCISE_RULES</b> (year end 31 Dec 2026).'+N2,tasks:[
  {q:'How many reports are in the register?',t:'num',a:ANS.p1_rep,why:'Population.'},
  {q:'How many are SOC 1 Type 2 or ISAE 3402 Type 2 (the types that can support ICFR reliance)?',t:'num',a:ANS.p1_suit,why:'Rule 1.'},
  {q:'How many of those have a period SHORTER than 180 days?',t:'num',a:ANS.p1_short,why:'Period end minus start.'},
  {q:'How many reports have a Qualified opinion?',t:'num',a:ANS.p1_qual,why:'A qualified opinion needs evaluation.'},
  {q:'How many reports PASS all three tests (right type, period at least 180 days, Unqualified)?',t:'num',a:ANS.p1_ok,why:'Rules 1, 2 and 3 together.'},
  {q:'Of those, how many need a bridge letter (period ends more than 90 days before 31 Dec 2026)?',t:'num',a:ANS.p1_bridge,why:'Gap to year-end.'},
  {q:'How many reports are PLANNED_FOR_ICFR = Y but are the wrong type (not SOC 1 Type 2 or ISAE 3402 Type 2)?',t:'num',a:ANS.p1_wrong,why:'The plan relies on a report that cannot support it.'},
  {q:'How many SOC 2 reports are there?',t:'num',a:ANS.p1_soc2,why:'SOC 2 is security focused, not ICFR.'}]},
 tb:[{title:'Explain how you decide whether a service organisation report can be relied on.',prompt:'A vendor gives you a SOC report. How do you decide whether you can rely on it for your audit?',model:'First I check the type: SOC 1 or ISAE 3402 relates to financial reporting controls, whereas SOC 2 covers trust criteria and does not directly support ICFR. I need a Type 2 for operating effectiveness, covering a long enough period and an unqualified opinion. I check the scope covers the services and systems we use and how subservice organisations are treated. I compare the period to our year-end and ask for a bridge letter if there is a gap. I then read the exceptions and map the user entity controls to our own.',pts:['Check type: SOC 1 or ISAE 3402 for ICFR, Type 2 for operating effectiveness','Check period length and opinion','Check scope matches the services and systems we use','Check gap to year-end and get a bridge letter','Read exceptions and map user entity controls']}],
 quiz:[
  {q:'SOC 1 is about...',o:['Controls relevant to financial reporting','Marketing','Physical security only'],a:0,e:'ICFR relevance.'},
  {q:'Type 2 reports on...',o:['Design and operating effectiveness over a period','Design at one date','Nothing'],a:0,e:'Operating over time.'},
  {q:'SOC 2 is based on...',o:['Trust Services Criteria','COSO','COBIT'],a:0,e:'Security and related criteria.'},
  {q:'A gap between report period and year-end needs...',o:['A bridge letter','Nothing','A new vendor'],a:0,e:'Management confirms no change.'}]},

{id:'B2.2',trk:'B2',wk:TF,title:'Reading a Type 2 report: tests and exceptions',time:'about 3 hours',
 learn:[
  {h:'What is in the report',p:'A Type 2 report has: the <b>auditor\'s opinion</b>, <b>management\'s assertion</b>, a <b>system description</b>, and the <b>tests of controls with results</b>. The results table lists each <b>control objective</b>, the controls, the <b>tests performed</b>, the <b>sample size</b> and any <b>exceptions</b>. Management of the service organisation may add a response.'},
  {h:'Evaluate the exceptions',p:'Do not stop at the opinion. Read the <b>exceptions</b>: how many, in which <b>control objectives</b>, how they relate to your risks, and what management said. An unqualified opinion can still contain exceptions that matter to <b>you</b>. If an objective may not be achieved, think about <b>compensating controls</b> on your side or extra testing.'}],
 why:'Reviewing the details instead of just the opinion is what interviewers mean by professional scepticism.',
 sim:[],files:[T2X],
 lab:{intro:'Open <b>'+T2X+'</b>: the test results of 30 service organisation controls in six control objectives (CO1 to CO6).'+N2,tasks:[
  {q:'How many controls were tested?',t:'num',a:ANS.p2_ctl,why:'Rows in TESTS.'},
  {q:'How many items were tested in total (sum of SAMPLE)?',t:'num',a:ANS.p2_samples,why:'Add the SAMPLE column.'},
  {q:'How many controls had at least one exception?',t:'num',a:ANS.p2_ex,why:'EXCEPTIONS above 0.'},
  {q:'How many controls had exactly ONE exception?',t:'num',a:ANS.p2_one,why:'Follow up with the service organisation.'},
  {q:'How many controls had TWO or more exceptions?',t:'num',a:ANS.p2_two,why:'The more serious group.'},
  {q:'How many exceptions in total?',t:'num',a:ANS.p2_tot,why:'Sum of EXCEPTIONS.'},
  {q:'How many control objectives are NOT achieved under the rule (any control in the objective has 2 or more exceptions)?',t:'num',a:ANS.p2_na,why:'Distinct objectives.'},
  {q:'Which control objective has the most exceptions in total? (type the code, e.g. co1)',t:'txt',a:ANS.p2_top,why:'Add exceptions by objective.'}]},
 tb:[{title:'Explain how you evaluate exceptions in a Type 2 report.',prompt:'The auditor\'s opinion is unqualified but the report lists exceptions. What do you do?',model:'I read the test results rather than rely on the opinion alone. I list the exceptions by control objective, check how many items were tested and what management responded. I decide whether any objective may not have been achieved for the services we use, and I consider the link to our own risks. Where an objective is affected, I look for compensating controls on our side or do additional testing, and I raise follow-up questions with the service organisation. I document my conclusion.',pts:['Read the test results, not only the opinion','List exceptions by control objective with sample sizes and responses','Judge whether an objective may not be achieved for our services','Consider compensating controls or extra testing','Follow up with the service organisation and document']}],
 quiz:[
  {q:'An unqualified opinion means...',o:['Exceptions may still exist and matter to you','No exceptions','The report is wrong'],a:0,e:'Read the table.'},
  {q:'A control objective is...',o:['What a group of controls is meant to achieve','A sample','A fee'],a:0,e:'The purpose of the controls.'},
  {q:'With exceptions in an objective you consider...',o:['Compensating controls or extra testing','Nothing','Cancelling the vendor'],a:0,e:'Respond proportionately.'},
  {q:'The report\'s tests are performed by...',o:['The service auditor','You','The vendor\'s sales team'],a:0,e:'Independent service auditor.'}]},

{id:'B2.3',trk:'B2',wk:TF,title:'User entity controls and subservice organisations',time:'about 3 hours',
 learn:[
  {h:'Your side of the control',p:'Service organisation controls only work if customers do their part. The report lists <b>complementary user entity controls (CUECs)</b>: controls <b>you</b> must have, such as reviewing user access or reconciling output. For each CUEC, map it to <b>your own control</b>, check it was <b>tested</b>, and check the result. A CUEC with no control on your side is a <b>gap in your control environment</b>, not the vendor\'s.'},
  {h:'Subservice organisations',p:'The service organisation may use <b>subservice organisations</b> (for example a data centre). With the <b>carve-out method</b> the report excludes them, so you need <b>their own report</b> or other evidence, and the <b>complementary subservice organisation controls (CSOCs)</b> must be covered. With the <b>inclusive method</b> their controls are in the report.'}],
 why:'Candidates who think about both sides, vendor and customer, impress interviewers. Most ICFR gaps here are on the customer side.',
 sim:[],files:[CUX],
 lab:{intro:'Open <b>'+CUX+'</b>. <b>CUECS</b> lists 24 user entity controls, the Thornfield control mapped to each (blank if none), whether tested and the result. <b>SUBSERVICE</b> lists the vendor\'s subservice organisations and how they are treated.',tasks:[
  {q:'How many CUECs are listed?',t:'num',a:ANS.p3_cuec,why:'Population.'},
  {q:'How many CUECs have NO Thornfield control mapped?',t:'num',a:ANS.p3_none,why:'Gap on the customer side.'},
  {q:'How many mapped CUECs have NOT been tested?',t:'num',a:ANS.p3_untested,why:'Mapped but unproven.'},
  {q:'How many CUECs have a Deficient result?',t:'num',a:ANS.p3_def,why:'The customer control failed.'},
  {q:'How many CUECs are mapped, tested and Effective?',t:'num',a:ANS.p3_ok,why:'The covered group.'},
  {q:'How many subservice organisations are treated by the CARVE-OUT method?',t:'num',a:ANS.p3_carve,why:'Their controls are not in the report.'},
  {q:'How many carve-out subservice organisations have NO SOC report obtained?',t:'num',a:ANS.p3_noreport,why:'No evidence for those controls.'},
  {q:'How many carve-out subservice organisations have the CSOCs NOT covered by Thornfield?',t:'num',a:ANS.p3_nocsoc,why:'Complementary controls missing.'}]},
 tb:[{title:'Explain CUECs and the carve-out method.',prompt:'What are complementary user entity controls and why do carve-outs matter?',model:'CUECs are the controls the customer must operate for the service organisation\'s controls to be effective, such as access reviews or reconciling outputs. I map each to our own control, check it was tested and effective, and treat any without a control as a gap on our side. For subservice organisations, the carve-out method excludes their controls from the report, so I need their own report or other evidence and I must make sure the complementary subservice organisation controls are covered. With the inclusive method their controls are in the report.',pts:['CUECs are controls the customer must operate','Map each CUEC to our own tested control','CUEC with no control is a gap on our side','Carve-out excludes subservice controls, so get their report or evidence','Check complementary subservice controls are covered']}],
 quiz:[
  {q:'CUEC stands for...',o:['Complementary user entity control','Central user error check','Control unit exception code'],a:0,e:'Customer-side control.'},
  {q:'In a carve-out the subservice organisation\'s controls are...',o:['Excluded from the report','Included','Ignored by everyone'],a:0,e:'You need other evidence.'},
  {q:'A CUEC with no customer control is...',o:['A gap on your side','The vendor\'s fault','Not important'],a:0,e:'You must operate it.'},
  {q:'Inclusive method means...',o:['Subservice controls are in the report','Subservice is excluded','No report'],a:0,e:'Included in the description.'}]},

{id:'B2.4',trk:'B2',wk:TF,title:'SOC 2 and the Trust Services Criteria in cloud assurance',time:'about 3 hours',
 learn:[
  {h:'The criteria',p:'A SOC 2 report covers one or more of five <b>Trust Services Criteria</b> categories: <b>Security</b> (the common criteria: always in scope), <b>Availability</b>, <b>Processing integrity</b>, <b>Confidentiality</b> and <b>Privacy</b>. The vendor chooses which optional categories to include, so two vendors with a SOC 2 may be covered very differently.'},
  {h:'Using it in vendor assurance',p:'List what <b>you require</b> from the vendor (for example uptime, data protection, correct processing) and map each requirement to a category. Then compare to the <b>categories in scope</b> of the report. Requirements in categories <b>not in scope</b> are <b>not covered</b> by the report and need other evidence. Also check the <b>report period</b>, <b>exceptions</b>, <b>subservice organisations</b> and the <b>user controls</b>, as for any assurance report.'}],
 why:'Cloud vendors usually give a SOC 2. Knowing what it does and does not cover is a core skill for security and GRC roles.',
 sim:[],files:[S2X],
 lab:{intro:'Open <b>'+S2X+'</b>. <b>DUE_DILIGENCE</b> lists 30 vendor requirements Thornfield has, each mapped to a category, and whether it is required. <b>REPORT_SCOPE</b> shows which categories are in the vendor\'s SOC 2 report.',tasks:[
  {q:'How many requirements are listed?',t:'num',a:ANS.p4_items,why:'Rows in DUE_DILIGENCE.'},
  {q:'How many are REQUIRED (REQUIRED = Y)?',t:'num',a:ANS.p4_req,why:'Only these matter for coverage.'},
  {q:'How many categories are IN scope of the report?',t:'num',a:ANS.p4_scoped,why:'Count of Y in REPORT_SCOPE.'},
  {q:'How many required requirements are COVERED (their category is in scope)?',t:'num',a:ANS.p4_cov,why:'Lookup the category.'},
  {q:'How many required requirements are NOT covered by the report?',t:'num',a:ANS.p4_gap,why:'They need other evidence.'},
  {q:'How many different categories contain those uncovered requirements?',t:'num',a:ANS.p4_gapcats,why:'Distinct categories in the gap.'},
  {q:'Which category (one word, e.g. availability) has the most uncovered required requirements?',t:'txt',a:ANS.p4_top,why:'Count the gap by category.'},
  {q:'Which category is always in scope of a SOC 2?',t:'mcq',o:['Privacy','Security','Availability'],a:1,why:'Security (common criteria) is always included.'}]},
 tb:[{title:'Explain what a SOC 2 report covers and how you use it for a cloud vendor.',prompt:'A cloud vendor gives you a SOC 2. How do you use it?',model:'I check which Trust Services Criteria categories are in scope: security is always included, but availability, processing integrity, confidentiality and privacy are optional. I map our requirements to those categories and see which are covered. Requirements in categories not in scope need other evidence. I also check the report type and period, read the exceptions, look at the subservice organisations and the user entity controls, and note that a SOC 2 is not designed to support financial reporting controls.',pts:['Security is always in scope; other categories are optional','Map our requirements to the categories','Requirements outside the scope need other evidence','Check type, period, exceptions, subservice organisations and user controls','SOC 2 is not designed to support ICFR']}],
 quiz:[
  {q:'Trust Services Criteria categories number...',o:['Five','Three','Ten'],a:0,e:'Security, availability, processing integrity, confidentiality, privacy.'},
  {q:'Which is always in a SOC 2?',o:['Security','Privacy','Availability'],a:0,e:'The common criteria.'},
  {q:'A requirement outside the report scope is...',o:['Not covered by the report','Covered','Irrelevant'],a:0,e:'Get other evidence.'},
  {q:'SOC 2 is mainly for...',o:['Security and trust assurance','ICFR','Tax'],a:0,e:'Not specifically ICFR.'}]}
];

const TG='Track B3. S/4HANA and RISE security';
